function getIntensity(history, energy) {
  var now = new Date(TODAY);
  var todayEnergy = energy || 3;

  // ── 1. COUNT SESSIONS IN LAST 7 DAYS ─────────────────────────────────
  var last7Days = Object.keys(history).filter(function(d){
    var diff = Math.round((now - new Date(d)) / 86400000);
    return diff >= 0 && diff <= 6 && history[d] && history[d].status === "done";
  }).sort().reverse();
  var sessionsThisWeek = last7Days.length;

  // ── 2. COUNT CONSECUTIVE TRAINING DAYS ───────────────────────────────
  var consecutive = 0;
  var check = new Date(TODAY);
  for (var i=0; i<14; i++) {
    var ds = check.toISOString().split("T")[0];
    if (history[ds] && history[ds].status === "done") {
      consecutive++;
      check.setDate(check.getDate() - 1);
    } else break;
  }

  // ── 3. DAYS SINCE LAST REST ───────────────────────────────────────────
  var daysSinceRest = consecutive; // same as consecutive days

  // ── 4. RECENT ENERGY AVERAGE ──────────────────────────────────────────
  var recentEnergies = last7Days.slice(0,3).map(function(d){
    return (history[d] && history[d].energy) || 3;
  });
  var avgEnergy = recentEnergies.length
    ? recentEnergies.reduce(function(a,b){return a+b;},0) / recentEnergies.length
    : 3;

  // ── 5. READ ACTUAL SET PERFORMANCE (THE SMART PART) ──────────────────
  // Look at the last completed session and see how well sets were done
  var lastSession = last7Days[0]; // most recent completed session
  var setPerformance = "neutral"; // crushed / neutral / struggled

  if (lastSession) {
    var lastExercises = (history[lastSession].exercises || []).filter(function(e){
      return e.w > 0 && !e.isFinisher;
    });

    if (lastExercises.length > 0) {
      var totalPlannedSets = 0;
      var totalCompletedSets = 0;
      var totalRepsHit = 0;
      var totalRepsExpected = 0;

      lastExercises.forEach(function(ex){
        var savedSets = gs("ig_sets_"+ex.id+"_"+lastSession, null);
        if (savedSets && savedSets.length) {
          totalPlannedSets += savedSets.length;
          var doneSets = savedSets.filter(function(s){ return s.done; });
          totalCompletedSets += doneSets.length;
          doneSets.forEach(function(s){
            var repsLogged = parseInt(s.reps) || 0;
            var repsTarget = parseInt(ex.reps) || 10;
            totalRepsHit += repsLogged;
            totalRepsExpected += repsTarget;
          });
        }
      });

      if (totalPlannedSets > 0) {
        var completionRate = totalCompletedSets / totalPlannedSets;
        var repsRate = totalRepsExpected > 0 ? totalRepsHit / totalRepsExpected : 1;

        // Crushed it: completed all sets AND hit or exceeded rep targets
        if (completionRate >= 0.9 && repsRate >= 0.95) {
          setPerformance = "crushed";
        }
        // Struggled: couldn't complete sets OR fell significantly short on reps
        else if (completionRate < 0.7 || repsRate < 0.75) {
          setPerformance = "struggled";
        }
        // Otherwise neutral
      }
    }
  }

  // ── 6. COMBINE ALL SIGNALS → PRESCRIBE INTENSITY ─────────────────────

  // Hard overrides first
  if (todayEnergy <= 2) return "recovery";
  if (consecutive >= 5 || (consecutive >= 4 && todayEnergy < 4)) return "recovery";
  if (sessionsThisWeek >= 6) return "recovery";

  // Fatigued signals
  var fatigue = 0;
  if (consecutive >= 3) fatigue += 2;
  else if (consecutive >= 2) fatigue += 1;
  if (sessionsThisWeek >= 4) fatigue += 1;
  if (avgEnergy < 3) fatigue += 1;
  if (todayEnergy <= 3) fatigue += 1;
  if (setPerformance === "struggled") fatigue += 2; // last session was hard
  if (setPerformance === "crushed") fatigue -= 1;  // reward good performance

  // Fresh signals
  var freshness = 0;
  if (consecutive <= 1) freshness += 2;
  if (sessionsThisWeek <= 2) freshness += 1;
  if (todayEnergy >= 4) freshness += 1;
  if (todayEnergy === 5) freshness += 1;
  if (setPerformance === "crushed") freshness += 1; // crushed last session, ready for more
  if (setPerformance === "struggled") freshness -= 1;

  // Net score → intensity
  var score = freshness - fatigue;

  if (score >= 3) return "high";
  if (score >= 1) return "moderate";
  if (score >= -1) return "light";
  return "recovery";
}

// ── WORKOUT BUILDER ────────────────────────────────────────────────────────
function buildExercise(ex, totalDone, d, intensity, diffKey, genderKey, goalKey) {
  var gc = GENDER_CONFIG[genderKey];
  var inten = INTENSITY[intensity] || INTENSITY.moderate;
  var g = GOALS[goalKey] || GOALS.muscle;
  var isRecovery = intensity === "recovery";

  // Sets: stack difficulty + intensity + goal bonuses
  var sets = Math.max(2, ex.sets + d.setsBonus + inten.setsBonus + g.setsBonus);

  // Reps: goal drives the base, intensity adjusts, gender adds small bonus
  var baseReps = isRecovery ? 15 : g.reps;
  // Intensity nudges reps up or down from goal baseline
  if (!isRecovery) {
    if (inten === INTENSITY.high)     baseReps = Math.max(3, baseReps - 2);
    if (inten === INTENSITY.light)    baseReps = baseReps + 2;
    if (inten === INTENSITY.recovery) baseReps = 15;
  }
  if (gc && gc.repBonus > 0) baseReps += Math.round(gc.repBonus * 0.4);
  var reps = String(baseReps) + (isRecovery ? " (easy)" : "");

  // Rest: goal sets the multiplier, difficulty modifies it
  var restBase = typeof ex.rest === "number" ? ex.rest : parseInt((ex.rest||"90").replace("s","")) || 90;
  var rest = Math.round(restBase * d.restMult * g.restMult) + "s";

  // Weight: goal + intensity + difficulty stack
  var stored = getW()[ex.id];
  var prog = Math.floor(totalDone/4) * (COMPOUND[ex.id] ? 5 : 2.5);
  var baseWt = stored !== undefined ? stored : Math.round((ex.w+prog)*d.weightMult/2.5)*2.5;
  var wt = Math.round(baseWt * inten.weightMult * g.weightMult / 2.5) * 2.5;
  if (isRecovery) wt = Math.round(baseWt * 0.6 / 2.5) * 2.5;

  var tempo = (diffKey==="advanced" && !isRecovery) ? d.tempo : "";
  return Object.assign({}, ex, {sets:sets, reps:reps, rest:rest, suggestedWeight:wt, tempo:tempo});
}

function buildWorkout(groups, totalDone, diffKey, intensityKey, locKey, recentIds, durationMins, genderKey, goalKey) {
  recentIds = recentIds || [];
  durationMins = durationMins || 60;
  var loc = LOCATIONS[locKey] || LOCATIONS.gym;
  var d = DIFFICULTY[diffKey] || DIFFICULTY.beginner;
  var recentSet = {};
  recentIds.forEach(function(id){ recentSet[id]=1; });
  var result = [], used = {};
  var dc = DURATION_CONFIG[durationMins] || DURATION_CONFIG[60];

  var isFullBody = groups.length >= 4;
  if (isFullBody) {
    var fbPool = shuffle(FULLBODY_EX.filter(function(ex){
      if (!loc.equip[ex.equip]) return false;
      if (diffKey==="beginner" && ex.diff!=="beginner") return false;
      if (diffKey==="intermediate" && ex.diff==="advanced") return false;
      return true;
    }));
    var covered = {legs:false,chest:false,back:false,shoulders:false};
    for (var fi=0; fi<fbPool.length && result.length<dc.exercises; fi++) {
      var fex = fbPool[fi];
      if (used[fex.id]) continue;
      if (!covered[fex.g] || result.length < dc.exercises-1) {
        result.push(buildExercise(fex, totalDone, d, intensityKey, diffKey, genderKey, goalKey));
        used[fex.id] = 1;
        covered[fex.g] = true;
      }
    }
    for (var fj=0; fj<fbPool.length && result.length<dc.exercises; fj++) {
      var fex2 = fbPool[fj];
      if (!used[fex2.id]) {
        result.push(buildExercise(fex2, totalDone, d, intensityKey, diffKey, genderKey, goalKey));
        used[fex2.id] = 1;
      }
    }
    return result;
  }

  for (var gi=0; gi<groups.length; gi++) {
    var g = groups[gi];
    var perG = groups.length===1 ? dc.exercises : groups.length<=2 ? Math.ceil(dc.exercises/2) : Math.ceil(dc.exercises/groups.length);
    var eligible = ALL_EX.filter(function(ex){
      if (ex.g!==g || !loc.equip[ex.equip]) return false;
      if (diffKey==="beginner" && ex.diff!=="beginner") return false;
      if (diffKey==="intermediate" && ex.diff==="advanced") return false;
      return true;
    });
    var fresh = eligible.filter(function(e){ return !recentSet[e.id]; });
    var stale = eligible.filter(function(e){ return recentSet[e.id]; });
    // Deprioritize frequently skipped exercises (move to end of pool)
    function sortBySkips(arr) {
      return arr.slice().sort(function(a,b){ return getSkipCount(a.id) - getSkipCount(b.id); });
    }
    var pool = shuffle(sortBySkips(fresh)).concat(shuffle(sortBySkips(stale)));
    var count = 0;
    for (var pi=0; pi<pool.length && count<perG; pi++) {
      var ex = pool[pi];
      if (used[ex.id]) continue;
      result.push(buildExercise(ex, totalDone, d, intensityKey, diffKey, genderKey, goalKey));
      used[ex.id] = 1; count++;
    }
  }
  return result.slice(0, dc.exercises);
}

}

function autoSession(h, excludeKey, genderKey) {

  var completed = Object.keys(h).filter(function(d){ return d!==TODAY && h[d]&&h[d].status==="done"; }).sort().reverse();
  var lastKey = completed.length ? h[completed[0]].sessionKey : null;
  var avoid = {};
  if (lastKey) avoid[lastKey]=1;
  if (excludeKey) avoid[excludeKey]=1;
  var unique = [];
  var seen = {};
  pool.forEach(function(k){ if(!seen[k]){seen[k]=1;unique.push(k);} });
  var candidates = unique.filter(function(k){ return !avoid[k]; });
  if (!candidates.length) candidates = unique;
  var pick = candidates[Math.floor(Math.random()*candidates.length)];
  return SESSIONS.filter(function(s){ return s.key===pick; })[0] || SESSIONS[0];
}

  Object.keys(MUSCLES).forEach(function(m){ v[m]=0; });

    if (d<WEEK_START || !h[d] || h[d].status!=="done") return;

}

function lastTrained(h) {

    if (!h[d]||h[d].status!=="done") return;
    (h[d].exercises||[]).forEach(function(ex){ if(!l[ex.g]) l[ex.g]=d; });
  });

}

function checkPlateau(h, id) {
  var wts = Object.keys(h).sort().reverse()
    .filter(function(d){ return h[d]&&h[d].status==="done"; })
    .slice(0,6)
    .map(function(d){
      var exs = h[d].exercises||[];

      return undefined;
    })
    .filter(function(w){ return w!==undefined; });
  return wts.length>=3 && wts[0]-wts[wts.length-1]<2.5;
}

                    <div key={i} style={{display:"grid",gridTemplateColumns:"28px 1fr 1fr 32px",gap:"4px",marginBottom:"4px",alignItems:"center",opacity:s.done?0.6:1}}>
                      <span style={{fontSize:"12px",color:C.muted,fontFamily:"monospace",textAlign:"center",fontWeight:"700"}}>{i+1}</span>
                      <input type="number" value={s.weight} onChange={function(e){updateSetLog(i,"weight",parseFloat(e.target.value)||0);}} style={{background:s.done?"transparent":"#1a1614",border:"1px solid "+(s.done?"transparent":C.border),borderRadius:"8px",padding:"8px 4px",color:s.done?C.muted:C.accent,fontSize:"13px",fontWeight:"800",textAlign:"center",fontFamily:"inherit",outline:"none",width:"100%"}}/>
                      <input type="number" placeholder={ex.reps} value={s.reps} onChange={function(e){updateSetLog(i,"reps",e.target.value);}} style={{background:s.done?"transparent":"#1a1614",border:"1px solid "+(s.done?"transparent":C.border),borderRadius:"8px",padding:"8px 4px",color:s.done?C.muted:C.text,fontSize:"13px",fontWeight:"700",textAlign:"center",fontFamily:"inherit",outline:"none",width:"100%"}}/>
                      <button onClick={function(){
                        var newDone = !s.done;
                        updateSetLog(i,"done",newDone);
                        if(navigator.vibrate) navigator.vibrate(newDone ? [60,40,60] : [30]);
                        // Start rest timer when set is marked done (not undone)
                        // Only start if not the last set
                        if(newDone && i < setLogs.length-1) setRestActive(true);
                      }} style={{width:"32px",height:"32px",borderRadius:"8px",border:"1px solid "+(s.done?C.green:C.border),background:s.done?C.green+"22":"transparent",color:s.done?C.green:C.muted,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"14px"}}>{s.done?"✓":"○"}</button>
                    </div>
                  );
                })}
              </div>
            )}
            {/* Rest timer - shows after marking a set done */}
            {restActive && <RestTimer seconds={restSeconds} onDismiss={function(){setRestActive(false);}}/>}

            {/* Last session sets */}
            {lastSets && lastSets.filter(function(s){return s.done;}).length > 0 && (
              <div style={{marginTop:"6px",padding:"6px 8px",background:"rgba(255,255,255,0.03)",borderRadius:"6px",border:"1px solid "+C.border}}>
                <div style={{fontSize:"10px",color:C.muted,fontFamily:"monospace",marginBottom:"4px",textTransform:"uppercase",letterSpacing:"0.08em"}}>Last session</div>
                <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
                  {lastSets.filter(function(s){return s.done;}).map(function(s,i){ return <span key={i} style={{fontSize:"11px",color:C.muted,background:"rgba(255,255,255,0.05)",padding:"2px 7px",borderRadius:"20px"}}>{s.weight}×{s.reps||"?"}</span>; })}
                </div>
              </div>
            )}
          </div>
        </div>
        {open && (
          <div style={{borderTop:"1px solid "+C.border,padding:"12px 16px",background:"#111"}}>
            <div style={{fontSize:"13px",color:"#bbb",lineHeight:1.6,marginBottom:"12px"}}>💡 {ex.tip}</div>
            <div style={{display:"flex",gap:"8px"}}>
              {ex.video && <a href={ex.video} target="_blank" rel="noreferrer" style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:"6px",background:"rgba(239,68,68,0.12)",border:"1px solid rgba(239,68,68,0.25)",borderRadius:"8px",padding:"9px",color:"#f87171",fontSize:"12px",fontWeight:"600",textDecoration:"none"}}><IVideo/> Form Video</a>}
              <button onClick={function(){setShowSub(true);}} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:"6px",background:"rgba(96,165,250,0.1)",border:"1px solid rgba(96,165,250,0.25)",borderRadius:"8px",padding:"9px",cursor:"pointer",color:C.blue,fontSize:"12px",fontWeight:"600",fontFamily:"inherit"}}><ISwap/> Can't do this?</button>
            </div>
            <textarea value={note} onChange={handleNoteChange} placeholder="Note for this exercise (felt strong, elbow tight...)" rows={2} style={{marginTop:"10px",width:"100%",background:"rgba(255,255,255,0.04)",border:"1px solid "+C.border,borderRadius:"8px",padding:"8px 10px",color:C.text,fontSize:"12px",fontFamily:"inherit",resize:"none",outline:"none",lineHeight:1.5}}/>
          </div>
        )}
      </div>
    </div>
  );
}

// ── SETTINGS SCREENS ─────────────────────────────────────────────────────────
</script>

<script type="text/babel">

var useState = React.useState;
var useEffect = React.useEffect;

function ExercisePicker(p) {
  var onStart = p.onStart;
  var onBack = p.onBack;
  var diffKey = p.diffKey;
  var locKey = p.locKey;
  var addMode = p.addMode || false; // true = single select for mid-workout

  var filterS = useState("all");
  var filter = filterS[0]; var setFilter = filterS[1];
  var selectedS = useState([]);
  var selected = selectedS[0]; var setSelected = selectedS[1];

  var loc = LOCATIONS[locKey] || LOCATIONS.gym;
  var muscleGroups = ["all","chest","back","legs","shoulders","arms","core"];

  var available = ALL_EX.filter(function(ex){
    if (!loc.equip[ex.equip]) return false;
    if (diffKey==="beginner" && ex.diff!=="beginner") return false;
    if (diffKey==="intermediate" && ex.diff==="advanced") return false;
    if (filter !== "all" && ex.g !== filter) return false;
    return true;
  });

  function toggle(ex) {
    if (addMode) {
      // In add mode, immediately add and go back
      onStart([ex]);
      return;
    }
    var ids = selected.map(function(e){return e.id;});
    if (ids.indexOf(ex.id) >= 0) {
      setSelected(selected.filter(function(e){return e.id!==ex.id;}));
    } else if (selected.length < 8) {
      setSelected(selected.concat([ex]));
    }
  }

  var muscleColors = {chest:"#f97316",back:"#3b82f6",legs:"#22c55e",shoulders:"#a855f7",arms:"#ec4899",core:"#14b8a6"};

  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"system-ui,sans-serif",maxWidth:"430px",margin:"0 auto"}}>
      <div style={{padding:"52px 24px 14px"}}>
        <BackBtn onBack={onBack}/>
        <div style={{fontSize:"20px",fontWeight:"900",marginBottom:"4px"}}>{addMode?"Add Exercise":"Build Your Own"}</div>
        <div style={{fontSize:"13px",color:C.muted,marginBottom:"16px"}}>{addMode?"Tap any exercise to add it to your session.":"Pick 2–8 exercises. Tap to select."}</div>
        {/* Muscle filter */}
        <div style={{display:"flex",gap:"6px",overflowX:"auto",marginBottom:"16px",paddingBottom:"4px"}}>
          {muscleGroups.map(function(g){
            var isActive = filter===g;
            var color = muscleColors[g]||C.accent;
            return <button key={g} onClick={function(){setFilter(g);}} style={{flexShrink:0,padding:"6px 14px",borderRadius:"20px",border:"1px solid "+(isActive?color:C.border),background:isActive?color+"22":"transparent",color:isActive?color:C.muted,fontSize:"12px",fontWeight:"700",cursor:"pointer",fontFamily:"inherit",textTransform:"capitalize"}}>{g==="all"?"All":g}</button>;
          })}
        </div>
      </div>

      {/* Exercise list */}
      <div style={{padding:"0 24px",paddingBottom:"120px"}}>
        {available.map(function(ex){
          var isSelected = selected.map(function(e){return e.id;}).indexOf(ex.id) >= 0;
          var color = muscleColors[ex.g]||C.accent;
          return (
            <button key={ex.id} onClick={function(){toggle(ex);}} style={{width:"100%",display:"flex",alignItems:"center",gap:"12px",background:isSelected?color+"18":C.card,border:"2px solid "+(isSelected?color:C.border),borderRadius:"12px",padding:"14px",marginBottom:"8px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
              <div style={{width:"10px",height:"10px",borderRadius:"50%",background:color,flexShrink:0}}/>
              <div style={{flex:1}}>
                <div style={{fontSize:"14px",fontWeight:"700",color:C.text}}>{ex.name}</div>
                <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{ex.equip} · {ex.g}</div>
              </div>
              {isSelected && <div style={{fontSize:"16px",color:color}}>✓</div>}
            </button>
          );
        })}
      </div>

      {/* Start button */}
      {selected.length >= 2 && (
        <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:"430px",padding:"16px 24px",paddingBottom:"calc(16px + env(safe-area-inset-bottom,0px))",background:"linear-gradient(transparent, "+C.bg+" 30%)",backdropFilter:"blur(8px)"}}>
          <button onClick={function(){onStart(selected);}} style={{width:"100%",padding:"16px",borderRadius:"16px",border:"none",background:C.accent,color:"#fff",fontWeight:"900",fontSize:"16px",cursor:"pointer",fontFamily:"inherit"}}>
            Start with {selected.length} exercise{selected.length>1?"s":""} →
          </button>
        </div>
      )}
    </div>
  );
}

function GenderOnboarding(p) {
  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px"}}>
      <div style={{fontSize:"48px",marginBottom:"16px"}}>🏋️</div>
      <div style={{fontSize:"26px",fontWeight:"900",color:C.text,letterSpacing:"-0.5px",marginBottom:"8px",textAlign:"center"}}>Welcome to Iron Log</div>
      <div style={{fontSize:"14px",color:C.muted,marginBottom:"40px",textAlign:"center",lineHeight:1.6}}>One quick question to personalize your workouts, rep ranges, and training rotation.</div>
      <div style={{width:"100%",display:"flex",flexDirection:"column",gap:"12px"}}>
        {Object.keys(GENDER_CONFIG).map(function(key){

              <div style={{fontSize:"36px"}}>{g.emoji}</div>
              <div>
                <div style={{fontSize:"18px",fontWeight:"800",color:C.text}}>{g.label}</div>

      </div>

}

function GoalOnboarding(p) {
  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px"}}>
      <div style={{fontSize:"48px",marginBottom:"16px"}}>🎯</div>
      <div style={{fontSize:"26px",fontWeight:"900",color:C.text,letterSpacing:"-0.5px",marginBottom:"8px",textAlign:"center"}}>What's your main goal?</div>
      <div style={{fontSize:"14px",color:C.muted,marginBottom:"32px",textAlign:"center",lineHeight:1.6}}>This shapes your rep ranges, rest periods, and weight targets. You can change it anytime.</div>
      <div style={{width:"100%",display:"flex",flexDirection:"column",gap:"10px"}}>
        {Object.keys(GOALS).map(function(key){
          var g=GOALS[key];
          return (
            <button key={key} onClick={function(){p.onSelect(key);}} style={{width:"100%",display:"flex",alignItems:"center",gap:"16px",background:C.card,border:"1px solid "+C.border,borderRadius:"16px",padding:"18px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
              <div style={{fontSize:"32px"}}>{g.emoji}</div>
              <div>
                <div style={{fontSize:"16px",fontWeight:"800",color:C.text}}>{g.label}</div>
                <div style={{fontSize:"12px",color:C.muted,marginTop:"3px"}}>{g.note}</div>
              </div>
            </button>
          );

      </div>

function SettingsScreen(p) {
  var type = p.type;
  var current = p.current;
  var onBack = p.onBack;
  var onSelect = p.onSelect;

  if (type === "difficulty") {
    var ai = p.totalDone>=20?"advanced":p.totalDone>=8?"intermediate":"beginner";

        <div style={{fontSize:"12px",color:C.orange,marginBottom:"20px",padding:"10px 14px",background:"rgba(232,93,38,0.08)",borderRadius:"10px",border:"1px solid rgba(232,93,38,0.2)"}}>⚡ Changes rebuild your current workout instantly.</div>
        {Object.keys(DIFFICULTY).map(function(key){

          return (

              <div style={{fontSize:"32px"}}>{d.emoji}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
                  <span style={{fontWeight:"800",fontSize:"16px",color:isCur?d.color:C.text}}>{d.label}</span>
                  {isAI && <span style={{fontSize:"10px",background:C.accent+"22",color:C.accent,padding:"2px 8px",borderRadius:"20px",fontWeight:"700"}}>AI Pick</span>}
                  {isCur && <span style={{fontSize:"10px",background:d.color+"22",color:d.color,padding:"2px 8px",borderRadius:"20px",fontWeight:"700"}}>Active</span>}
                </div>
                <div style={{fontSize:"12px",color:C.muted,marginTop:"5px"}}>
                  {key==="beginner"?"Standard sets · 75% base weight · Longer rest":key==="intermediate"?"+1 set · Full weight · Standard rest":"+2 sets · 115% weight · 3s eccentric · Shorter rest"}
                </div>

            </button>

        <div style={{fontSize:"12px",color:C.orange,marginBottom:"20px",padding:"10px 14px",background:"rgba(232,93,38,0.08)",borderRadius:"10px",border:"1px solid rgba(232,93,38,0.2)"}}>⚡ Changes rebuild your current workout instantly.</div>
        {Object.keys(LOCATIONS).map(function(key){
          var loc=LOCATIONS[key]; var isCur=current===key;
          return (
            <button key={key} onClick={function(){onSelect(key);}} style={{width:"100%",display:"flex",alignItems:"center",gap:"16px",background:isCur?C.accent+"14":C.card,border:"2px solid "+(isCur?C.accent:C.border),borderRadius:"16px",padding:"18px",marginBottom:"12px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
              <div style={{fontSize:"32px"}}>{loc.emoji}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                  <span style={{fontWeight:"800",fontSize:"16px",color:isCur?C.accent:C.text}}>{loc.label}</span>
                  {isCur && <span style={{fontSize:"10px",background:C.accent+"22",color:C.accent,padding:"2px 8px",borderRadius:"20px",fontWeight:"700"}}>Active</span>}
                </div>
                <div style={{fontSize:"12px",color:C.muted,marginTop:"4px"}}>{key==="home"?"Bodyweight only — no equipment needed":Object.keys(loc.equip).join(" · ")}</div>
              </div>
            </button>
          );
        })}
      </div>
    );
  }

  if (type === "intensity") {

        <div style={{fontSize:"13px",color:C.muted,marginBottom:"6px",lineHeight:1.6}}>Normally this is set automatically based on how much you've trained this week and your energy rating. You can override it here.</div>
        <div style={{background:"rgba(232,93,38,0.08)",border:"1px solid rgba(232,93,38,0.2)",borderRadius:"12px",padding:"12px 14px",marginBottom:"20px"}}>
          <div style={{fontSize:"12px",color:C.accent,fontWeight:"700",marginBottom:"3px"}}>🤖 Auto mode reads your week</div>
          <div style={{fontSize:"11px",color:C.muted,lineHeight:1.5}}>Trained a lot recently? It drops intensity. Fresh and energetic? It pushes harder. You never need to touch this.</div>
        </div>
        <button onClick={function(){onSelect(null);}} style={{width:"100%",display:"flex",alignItems:"center",gap:"16px",background:current===null?"rgba(255,255,255,0.08)":C.card,border:"2px solid "+(current===null?C.accent:C.border),borderRadius:"16px",padding:"18px",marginBottom:"12px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
          <div style={{fontSize:"32px"}}>🤖</div>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
              <span style={{fontWeight:"800",fontSize:"16px",color:current===null?C.accent:C.text}}>Auto</span>
              {current===null && <span style={{fontSize:"10px",background:C.accent+"22",color:C.accent,padding:"2px 8px",borderRadius:"20px",fontWeight:"700"}}>Active</span>}
            </div>
            <div style={{fontSize:"12px",color:C.muted,marginTop:"5px"}}>Smart — adjusts based on your week and energy</div>
          </div>
        </button>

          return (

                </div>

                <div style={{fontSize:"11px",color:inten.color,marginTop:"3px"}}>Target: {inten.reps} reps · {Math.round(inten.weightMult*100)}% weight</div>
              </div>
            </button>
          );

      </div>

  if (type === "goal") {

        <button onClick={p.onBack} style={{display:"flex",alignItems:"center",gap:"8px",background:"rgba(255,255,255,0.07)",border:"1px solid "+C.border,borderRadius:"10px",color:C.text,cursor:"pointer",fontSize:"13px",fontWeight:"700",fontFamily:"inherit",marginBottom:"22px",padding:"9px 16px"}}><IBack/> Back</button>
        <div style={{fontSize:"20px",fontWeight:"900",marginBottom:"6px"}}>Training Goal</div>
        <div style={{fontSize:"13px",color:C.muted,marginBottom:"20px",lineHeight:1.5}}>Sets the rep ranges, rest periods, and weight targets for every session. Change anytime your focus shifts.</div>
        {Object.keys(GOALS).map(function(key){
          var g=GOALS[key]; var isCur=current===key;
          return (
            <button key={key} onClick={function(){onSelect(key);}} style={{width:"100%",display:"flex",alignItems:"center",gap:"16px",background:isCur?g.color+"18":C.card,border:"2px solid "+(isCur?g.color:C.border),borderRadius:"16px",padding:"18px",marginBottom:"12px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
              <div style={{fontSize:"32px"}}>{g.emoji}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
                  <span style={{fontWeight:"800",fontSize:"16px",color:isCur?g.color:C.text}}>{g.label}</span>
                  {isCur && <span style={{fontSize:"10px",background:g.color+"22",color:g.color,padding:"2px 8px",borderRadius:"20px",fontWeight:"700"}}>Active</span>}
                </div>
                <div style={{fontSize:"12px",color:C.muted,marginTop:"4px",lineHeight:1.5}}>{g.note}</div>
                <div style={{fontSize:"11px",color:g.color,marginTop:"4px"}}>{g.reps} reps · {g.restNote} · {Math.round(g.weightMult*100)}% weight</div>
              </div>
            </button>
          );
        })}
      </div>
    );
  }

  if (type === "gender") {
    return (
      <div style={{padding:"52px 24px 80px"}}>
        <BackBtn onBack={onBack}/>
        <div style={{fontSize:"20px",fontWeight:"900",marginBottom:"6px"}}>Profile</div>
        <div style={{fontSize:"13px",color:C.muted,marginBottom:"24px"}}>Adjusts rep ranges, rotation priority, and volume targets.</div>
        {Object.keys(GENDER_CONFIG).map(function(key){
          var g=GENDER_CONFIG[key]; var isCur=current===key;
          return (
            <button key={key} onClick={function(){onSelect(key);}} style={{width:"100%",display:"flex",alignItems:"center",gap:"16px",background:isCur?C.accent+"18":C.card,border:"2px solid "+(isCur?C.accent:C.border),borderRadius:"16px",padding:"18px",marginBottom:"12px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
              <div style={{fontSize:"32px"}}>{g.emoji}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                  <span style={{fontWeight:"800",fontSize:"16px",color:isCur?C.accent:C.text}}>{g.label}</span>

              </div>
            </button>
          );
        })}

        {/* Reset all data */}
        <div style={{marginTop:"32px",borderTop:"1px solid "+C.border,paddingTop:"24px"}}>
          <div style={{fontSize:"13px",fontWeight:"700",color:C.text,marginBottom:"6px"}}>Danger zone</div>
          <div style={{fontSize:"12px",color:C.muted,marginBottom:"14px"}}>Wipes all sessions, weights, PRs and settings. Starts fresh like a new install.</div>

<script type="text/babel">

var useState = React.useState;

function App() {

  var goalS = useState(function(){return gs("ig_goal","muscle");});
  var showPickerS = useState(false);
  var showPicker=showPickerS[0]; var setShowPicker=showPickerS[1];
  var goal=goalS[0]; var setGoal=goalS[1];
  var intensityOverrideS = useState(null); // null = auto
  var intensityOverride=intensityOverrideS[0]; var setIntensityOverride=intensityOverrideS[1];
  var genderS = useState(function(){return gs("ig_gender",null);});
  var gender=genderS[0]; var setGender=genderS[1];
  var durationS = useState(function(){return gs("ig_dur",60);});
  var duration=durationS[0]; var setDuration=durationS[1];
  var notesS = useState("");
  var notes=notesS[0]; var setNotes=notesS[1];
  var celebratingS = useState(false);
  var celebrating=celebratingS[0]; var setCelebrating=celebratingS[1];
  var nextWtsS = useState([]);
  var nextWts=nextWtsS[0]; var setNextWts=nextWtsS[1];
  var newPRsS = useState([]);
  var newPRs=newPRsS[0]; var setNewPRs=newPRsS[1];
  var rebuildingS = useState(false);
  var rebuilding=rebuildingS[0]; var setRebuilding=rebuildingS[1];
  var startTimeS = useState(null);
  var startTime=startTimeS[0]; var setStartTime=startTimeS[1];
  var elapsedS = useState(0);
  var elapsed=elapsedS[0]; var setElapsed=elapsedS[1];
  var showTipsS = useState(function(){ return gs("ig_tips_seen", false) === false; });
  var confirmS = useState(null); // {message, onConfirm}
  var confirm = confirmS[0]; var setConfirm = confirmS[1];
  var warmupIdxS = useState(0);
  var warmupIdx=warmupIdxS[0]; var setWarmupIdx=warmupIdxS[1];
  var showTips=showTipsS[0]; var setShowTips=showTipsS[1];

  var todayRec = history[TODAY];
  var streak = buildStreak(history);
  var totalDone = Object.keys(history).filter(function(d){return history[d]&&history[d].status==="done";}).length;
  var intensityKey = intensityOverride || getIntensity(history, energy);
  var intensity = INTENSITY[intensityKey] || INTENSITY.moderate;
  var diff = DIFFICULTY[diffKey];
  var weightLoggedThisWeek = (stats.bodyLog||[]).some(function(e){return e.date>=WEEK_START;});
  var showWeightReminder = !weightLoggedThisWeek;

  useEffect(function(){
    if (todayRec && todayRec.exercises && todayRec.sessMeta) {
      setExercises(todayRec.exercises);
      setSessMeta(todayRec.sessMeta);
      setNotes(todayRec.notes||"");
      setStartTime(todayRec.startTime||null);
      if (todayRec.status==="done" || todayRec.status==="skipped") {
        setWorkPhase(todayRec.isRest?"rest":"done");
      } else if (todayRec.energy) {
        setEnergy(todayRec.energy);
        setWorkPhase("workout");
      } else {
        setWorkPhase("energy");
      }
    }
  }, []);

  useEffect(function(){
    var interval = null;
    if (workPhase==="workout" && startTime) {
      interval = setInterval(function(){
        setElapsed(Math.floor((Date.now()-startTime)/1000));
      }, 1000);
    } else {
      setElapsed(0);
    }
    return function(){ if(interval) clearInterval(interval); };
  }, [workPhase, startTime]);

  function saveH(next){ setHistory(next); ss("ig_h6",next); }
  function saveS(next){ setStats(next); ss("ig_s6",next); }

  function getLastWeight(exId) {
    var past = Object.keys(history).filter(function(d){return d!==TODAY&&history[d]&&history[d].status==="done";}).sort().reverse();
    for (var i=0;i<past.length;i++) {
      var exs = history[past[i]].exercises||[];
      for (var j=0;j<exs.length;j++) {
        if (exs[j].id===exId) return getW()[exId]||exs[j].suggestedWeight||exs[j].w;
      }
    }
    return null;
  }

  function getLastSets(exId) {
    var past = Object.keys(history).filter(function(d){return d!==TODAY&&history[d]&&history[d].status==="done";}).sort().reverse();
    for (var i=0;i<past.length;i++) {
      var dated = gs("ig_sets_"+exId+"_"+past[i], null);
      if (dated && dated.some(function(s){return s.done;})) return dated;
    }
    return null;
  }

  function rebuildExercises(newDiff, newPhase, newLoc) {
    if (!sessMeta) return;
    setRebuilding(true);
    var past = Object.keys(history).filter(function(d){return d!==TODAY;}).sort().reverse().slice(0,10);
    var recent = [];
    past.forEach(function(d){ (history[d]&&history[d].exercises||[]).forEach(function(e){recent.push(e.id);}); });
    var resolvedPhase = intensityKey;
    var newExs = buildWorkout(sessMeta.groups, totalDone, newDiff||diffKey, intensityKey, newLoc||locKey, recent, duration, gender, goal);
    setExercises(newExs);
    var updated = Object.assign({}, history[TODAY]||{}, {exercises:newExs});
    saveH(Object.assign({}, history, {[TODAY]:updated}));
    setTimeout(function(){setRebuilding(false);}, 600);
  }

  function applyDiff(k) {
    setDiffKey(k); ss("ig_d3",k);
    if (sessMeta && (workPhase==="workout"||workPhase==="done")) rebuildExercises(k, undefined, undefined);
    setScreen("home");
  }
  function applyLoc(k) {
    setLocKey(k); ss("ig_l3",k);
    if (sessMeta && (workPhase==="workout"||workPhase==="done")) rebuildExercises(undefined, undefined, k);
    setScreen("home");
  }
  function applyGoal(k) {

    if (sessMeta && (workPhase==="workout"||workPhase==="done")) rebuildExercises(undefined, undefined, undefined);
    setScreen("home");
  }

  function applyIntensity(k) {
    setIntensityOverride(k);
    if (sessMeta && (workPhase==="workout"||workPhase==="done")) rebuildExercises(undefined, undefined, undefined);
    setScreen("home");
  }
  function applyGender(k) {
    setGender(k); ss("ig_gender",k);
    setScreen("home");
  }

  function handleEnergy(e) {
    setEnergy(e);
    if (e<=2) setWorkPhase("rest");
    else setWorkPhase("pick");
  }
  function logRestDay() {
    var updated = Object.assign({}, todayRec||{}, {status:"skipped",isRest:true,energy:energy});
    saveH(Object.assign({},history,{[TODAY]:updated}));
    setWorkPhase("done");
    setSessMeta({key:"rest",label:"Rest Day",emoji:"🌿",groups:[]});
  }
  function dropDifficulty() {
    setDiffKey("beginner"); ss("ig_d3","beginner");
  }

  function startSess(s) {
    var past = Object.keys(history).filter(function(d){return d!==TODAY;}).sort().reverse().slice(0,10);
    var recent = [];
    past.forEach(function(d){ (history[d]&&history[d].exercises||[]).forEach(function(e){recent.push(e.id);}); });
    var dc = DURATION_CONFIG[duration]||DURATION_CONFIG[60];
    var exs = buildWorkout(s.groups, totalDone, diffKey, intensityKey, locKey, recent, duration, gender, goal);
    var finishers = dc.finisher ? pickFinishers(s.key, totalDone) : [];
    var allExs = exs.concat(finishers);
    var t = Date.now();
    setExercises(allExs);
    setSessMeta(s);
    setStartTime(t);
    setWarmupIdx(0);
    var freshToday = {sessionKey:s.key,sessMeta:s,exercises:allExs,energy:energy,diffKey:diffKey,intensityKey:intensityKey,locKey:locKey,goalKey:goal,startTime:t};
    saveH(Object.assign({},history,{[TODAY]:freshToday}));
    setWorkPhase("workout");
  }

  function removeExercise(idx) {
    var ex = exercises[idx];
    if (ex) logSkippedExercise(ex.id);
    var upd = exercises.filter(function(e, i){ return i !== idx; });
    setExercises(upd);
    saveH(Object.assign({},history,{[TODAY]:Object.assign({},history[TODAY],{exercises:upd})}));
  }

  function addExerciseToWorkout(ex) {
    var d = DIFFICULTY[diffKey]||DIFFICULTY.beginner;
    var built = buildExercise(ex, totalDone, d, intensityKey, diffKey, gender, goal);
    var upd = exercises.concat([built]);
    setExercises(upd);
    saveH(Object.assign({},history,{[TODAY]:Object.assign({},history[TODAY],{exercises:upd})}));
    setScreen("home");
  }

  function swapEx(idx, alt) {
    var stored = getW()[alt.id];
    var prog = Math.floor(totalDone/4)*(COMPOUND[alt.id]?5:2.5);
    var d = DIFFICULTY[diffKey]||DIFFICULTY.beginner;
    var nw = stored!==undefined ? stored : Math.round((alt.w+prog)*d.weightMult/2.5)*2.5;
    var upd = exercises.map(function(e,i){ return i===idx ? Object.assign({},alt,{suggestedWeight:nw,sets:e.sets,reps:e.reps,rest:e.rest}) : e; });
    setExercises(upd);
    saveH(Object.assign({},history,{[TODAY]:Object.assign({},history[TODAY],{exercises:upd})}));
  }

  function handleExNote(exId, noteText) {
    var upd = exercises.map(function(e){ return e.id===exId ? Object.assign({},e,{note:noteText}) : e; });

  function markDone() {
    var dur = startTime ? Math.round((Date.now()-startTime)/60000) : null;
    var nw = exercises.filter(function(e){return e.w>0;}).map(function(e){
      var setData = gs("ig_sets_"+e.id, null);
      var doneSets = setData ? setData.filter(function(s){return s.done&&s.weight>0;}) : [];
      var allRepsHit = doneSets.length>0 && doneSets.every(function(s){ return parseInt(s.reps)>0; });
      var cur = doneSets.length>0 ? Math.max.apply(null,doneSets.map(function(s){return s.weight;})) : (getW()[e.id]||e.suggestedWeight||e.w);
      var inc = COMPOUND[e.id]?5:2.5;
      // Only advance weight if all sets were completed
      var next = allRepsHit ? Math.round((cur+inc)/2.5)*2.5 : cur;
      var l=getW(); l[e.id]=cur; saveW(l);
      return e.name+": "+cur+" lbs"+(allRepsHit?" → "+next+" lbs next":" (repeat weight)");
    });
    // Auto-detect PRs from actual logged sets
    var autoPRs = [];
    exercises.filter(function(e){return e.w>0&&e.isPR;}).forEach(function(e){
      var setData = gs("ig_sets_"+e.id, null);
      var doneSets = setData ? setData.filter(function(s){return s.done&&s.weight>0;}) : [];
      var bestW = doneSets.length ? Math.max.apply(null,doneSets.map(function(s){return s.weight;})) : (getW()[e.id]||e.suggestedWeight||e.w);
      var prevPRs = (stats.prs||[]).filter(function(p){return p.exercise===e.name;});
      var prevBest = prevPRs.length ? Math.max.apply(null,prevPRs.map(function(p){return p.weight;})) : 0;
      if (bestW > prevBest) autoPRs.push({date:TODAY,exercise:e.name,weight:bestW,reps:doneSets.length?doneSets[0].reps:"",auto:true});
    });
    if (autoPRs.length>0) {
      var updatedPRs = (stats.prs||[]).concat(autoPRs).sort(function(a,b){return b.date.localeCompare(a.date);});
      saveS(Object.assign({},stats,{prs:updatedPRs}));
      setNewPRs(autoPRs);
    }
    setNextWts(nw);
    setCelebrating(true);
    setTimeout(function(){setCelebrating(false);}, 10000);
    saveH(Object.assign({},history,{[TODAY]:Object.assign({},history[TODAY],{status:"done",notes:notes,duration:dur})}));
    setWorkPhase("done");
  }

                  <div style={{fontSize:"48px",marginBottom:"10px"}}>🌿</div>
                  <div style={{fontSize:"18px",fontWeight:"900",color:C.text}}>Rest & Recover</div>
                  <div style={{fontSize:"13px",color:C.muted,marginTop:"6px",lineHeight:1.6}}>Low energy today. Recovery is training.</div>
                  <div style={{marginTop:"16px",background:"rgba(34,197,94,0.07)",border:"1px solid rgba(34,197,94,0.2)",borderRadius:"12px",padding:"14px",textAlign:"left"}}>
                    <div style={{fontSize:"11px",color:C.green,fontWeight:"700",marginBottom:"6px"}}>🥗 Nutrition Focus</div>
                    <div style={{fontSize:"13px",color:"#bbb",lineHeight:1.6}}>{NUTRITION[totalDone%NUTRITION.length]}</div>
                  </div>
                  <button onClick={logRestDay} style={{width:"100%",marginTop:"16px",padding:"14px",borderRadius:"12px",border:"none",background:"rgba(34,197,94,0.15)",color:C.green,fontWeight:"800",fontSize:"14px",cursor:"pointer",fontFamily:"inherit"}}>✓ Log as Rest Day</button>
                </div>
              </div>
            )}

            {/* PICK SESSION */}
            {workPhase==="pick" && (
              <div>
                <button onClick={function(){setEnergy(null);setWorkPhase("energy");}} style={{display:"flex",alignItems:"center",gap:"8px",background:"rgba(255,255,255,0.07)",border:"1px solid "+C.border,borderRadius:"10px",color:C.text,cursor:"pointer",fontSize:"13px",fontWeight:"700",fontFamily:"inherit",marginBottom:"16px",padding:"9px 16px"}}><IBack/> How are you feeling?</button>

                {energy===3 && diffKey!=="beginner" && (
                  <div style={{background:"rgba(234,179,8,0.08)",border:"1px solid rgba(234,179,8,0.25)",borderRadius:"14px",padding:"14px 16px",marginBottom:"16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"12px"}}>
                    <div style={{flex:1}}><div style={{fontSize:"13px",fontWeight:"700",color:"#eab308",marginBottom:"3px"}}>😐 Moderate energy today</div><div style={{fontSize:"12px",color:C.muted,lineHeight:1.5}}>Your trainer suggests dropping to Beginner intensity.</div></div>
                    <button onClick={dropDifficulty} style={{flexShrink:0,padding:"8px 14px",borderRadius:"10px",border:"none",background:"#eab308",color:"#000",fontWeight:"800",fontSize:"12px",cursor:"pointer",fontFamily:"inherit"}}>Drop it</button>
                  </div>
                )}
                {energy===4 && <div style={{background:C.green+"10",border:"1px solid "+C.green+"33",borderRadius:"14px",padding:"12px 16px",marginBottom:"16px"}}><div style={{fontSize:"12px",color:C.green,fontWeight:"700"}}>💪 Strong today — good day to push heavier than usual.</div></div>}
                {energy===5 && <div style={{background:C.accent+"12",border:"1px solid "+C.accent+"44",borderRadius:"14px",padding:"12px 16px",marginBottom:"16px"}}><div style={{fontSize:"12px",color:C.accent,fontWeight:"700"}}>🔥 Beast mode — max effort today. Chase a PR.</div></div>}

                <div style={{fontSize:"17px",fontWeight:"800",marginBottom:"12px"}}>Pick today's session</div>

                {/* Duration picker */}
                <div style={{marginBottom:"16px"}}>
                  <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginBottom:"10px"}}>Session Duration</div>
                  <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
                    {Object.keys(DURATION_CONFIG).map(function(mins){
                      var dc=DURATION_CONFIG[mins]; var isSelected=duration===parseInt(mins);
                      return <button key={mins} onClick={function(){var m=parseInt(mins);setDuration(m);ss("ig_dur",m);}} style={{padding:"7px 12px",borderRadius:"20px",border:"2px solid "+(isSelected?C.accent:C.border),background:isSelected?C.accent+"18":"transparent",cursor:"pointer",fontFamily:"inherit",fontSize:"11px",fontWeight:"700",color:isSelected?C.accent:C.muted}}>{dc.emoji} {dc.label}</button>;
                    })}
                  </div>
                  <div style={{fontSize:"11px",color:C.muted,marginTop:"8px"}}>{(DURATION_CONFIG[duration]||DURATION_CONFIG[60]).note}</div>
                </div>

                {getTopSkipped().length > 0 && (
                  <div style={{fontSize:"11px",color:C.muted,background:"rgba(255,255,255,0.03)",border:"1px solid "+C.border,borderRadius:"10px",padding:"8px 12px",marginBottom:"10px"}}>
                    🤖 Avoiding your recent skips: <span style={{color:"#888"}}>{getTopSkipped().join(", ")}</span>
                  </div>
                )}
                <button onClick={function(){var cancelled=sessMeta?sessMeta.key:null;startSess(autoSession(history,cancelled,gender));}} style={{width:"100%",padding:"18px",borderRadius:"16px",border:"none",background:C.accent,color:"#fff",fontWeight:"900",fontSize:"15px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:"10px",marginBottom:"16px",fontFamily:"inherit"}}>
                  🤖 AI — Optimal Session <span style={{fontWeight:"400",fontSize:"12px",opacity:0.8}}>{LOCATIONS[locKey].label} · {diff.label}</span>
                </button>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"12px"}}>
                  <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.12em",fontFamily:"monospace"}}>Or choose manually</div>
                  <button onClick={function(){setScreen("picker");}} style={{fontSize:"11px",color:C.accent,background:"transparent",border:"1px solid "+C.accent+"44",borderRadius:"20px",padding:"5px 12px",cursor:"pointer",fontFamily:"inherit",fontWeight:"700"}}>✏️ Build my own</button>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
                  {SESSIONS.map(function(s){
                    return (
                      <button key={s.key} onClick={function(){startSess(s);}} style={{background:C.card,border:"1px solid "+C.border,borderRadius:"12px",padding:"14px 12px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
                        <div style={{fontSize:"20px",marginBottom:"4px"}}>{s.emoji}</div>
                        <div style={{fontWeight:"700",fontSize:"14px",color:C.text}}>{s.label}</div>
                        <div style={{fontSize:"11px",color:C.muted,marginTop:"2px",lineHeight:1.4}}>{s.desc}</div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* WORKOUT */}
            {workPhase==="workout" && sessMeta && (
              <div>
                <div style={{background:"#111",border:"1px solid "+C.border,borderRadius:"14px",padding:"16px",marginBottom:"20px"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"4px"}}>
                    <div style={{fontSize:"10px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace"}}>Today's Session</div>
                    <button onClick={function(){setConfirm({message:"Change session? Your current exercises will reset.",onConfirm:resetToday});}} style={{display:"flex",alignItems:"center",gap:"5px",background:"rgba(255,255,255,0.07)",border:"1px solid "+C.border,borderRadius:"20px",padding:"5px 12px",cursor:"pointer",fontSize:"12px",color:C.muted,fontFamily:"inherit",fontWeight:"700"}}>↺ Change</button>
                  </div>
                  <div style={{fontSize:"20px",fontWeight:"900",color:C.text,marginTop:"4px"}}>{sessMeta.emoji} {sessMeta.label}</div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:"6px"}}>
                    <span style={{fontSize:"11px",color:C.muted}}>{LOCATIONS[locKey].emoji} {LOCATIONS[locKey].label} · {intensity.emoji} {intensity.label}</span>
                    <span style={{fontSize:"13px",fontWeight:"800",color:elapsed>3600?C.red:elapsed>2700?C.orange:C.accent,fontFamily:"monospace"}}>⏱ {fmtTime(elapsed)}</span>
                  </div>
                </div>

                {(DURATION_CONFIG[duration]&&DURATION_CONFIG[duration].warmup) && (
                  <div style={{marginBottom:"20px"}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"8px"}}>
                      <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace"}}>Warmup — ~10 min</div>
                      <button onClick={function(){setWarmupIdx(function(i){return i+1;});}} style={{fontSize:"11px",color:C.accent,background:"transparent",border:"none",cursor:"pointer",fontFamily:"inherit",fontWeight:"700"}}>🔄 Different option</button>
                    </div>
                    <div style={{fontSize:"13px",color:"#bbb",lineHeight:1.7,background:"#111",borderRadius:"10px",padding:"12px 14px"}}>{getWarmup(sessMeta.key, diffKey, locKey, warmupIdx)}</div>
                  </div>
                )}



                {exercises.filter(function(e){return !e.isFinisher;}).map(function(ex,i){
                  var lastWt = getLastWeight(ex.id);
                  var lastSavedSets = getLastSets(ex.id);
                  return <ExCard key={ex.id+i} ex={ex} idx={i} onSwap={swapEx} plateaued={checkPlateau(history,ex.id)} lastWeight={lastWt} onNoteChange={handleExNote} lastSets={lastSavedSets} onRemove={function(){removeExercise(exercises.indexOf(ex));}} />;
                })}

                {/* Add exercise button */}
                <button onClick={function(){setScreen("addex");}} style={{width:"100%",padding:"14px",borderRadius:"14px",border:"2px dashed "+C.border,background:"transparent",color:C.muted,cursor:"pointer",fontFamily:"inherit",fontWeight:"700",fontSize:"13px",marginBottom:"16px",display:"flex",alignItems:"center",justifyContent:"center",gap:"8px"}}>
                  + Add exercise
                </button>

                {exercises.some(function(e){return e.isFinisher;}) && (
                  <div>
                    <div style={{fontSize:"11px",color:C.accent,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginTop:"16px",marginBottom:"10px"}}>🔥 Finisher</div>
                    {exercises.filter(function(e){return e.isFinisher;}).map(function(ex,i){
                      var baseIdx = exercises.filter(function(e){return !e.isFinisher;}).length;
                      return <ExCard key={ex.id+"f"+i} ex={ex} idx={baseIdx+i} onSwap={function(){}} plateaued={false}/>;
                    })}
                  </div>
                )}

                {(DURATION_CONFIG[duration]&&DURATION_CONFIG[duration].cooldown) && (
                  <div>
                    <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginTop:"18px",marginBottom:"8px"}}>Cooldown</div>
                    <div style={{fontSize:"13px",color:"#999",lineHeight:1.7,marginBottom:"12px"}}>{COOLDOWN}</div>
                  </div>
                )}

                <div style={{marginTop:"12px"}}>
                  <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginBottom:"8px"}}>Session Notes</div>
                  <textarea value={notes} onChange={function(e){var v=e.target.value;setNotes(v);saveH(Object.assign({},history,{[TODAY]:Object.assign({},history[TODAY],{notes:v})}));}} placeholder="How did it feel? PRs? Notes for next time..." rows={3} style={{width:"100%",background:"#111",border:"1px solid "+C.border,borderRadius:"10px",padding:"12px",color:C.text,fontSize:"13px",fontFamily:"inherit",resize:"none",outline:"none",lineHeight:1.6}}/>
                </div>
                <div style={{display:"flex",gap:"10px",marginTop:"20px"}}>
                  <button onClick={markDone} style={{flex:1,padding:"18px",borderRadius:"16px",border:"none",background:C.accent,color:"#fff",fontWeight:"900",fontSize:"16px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:"8px",fontFamily:"inherit"}}><ICheck/> Done!</button>
                  <button onClick={markSkip} style={{padding:"18px 20px",borderRadius:"16px",border:"1px solid "+C.border,background:"transparent",color:C.muted,fontWeight:"700",fontSize:"14px",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px",fontFamily:"inherit"}}><ISkip/> Skip</button>
                </div>
              </div>
            )}

            {/* DONE */}
            {workPhase==="done" && sessMeta && (
              <div>
                <div style={{background:todayRec&&todayRec.status==="done"?"rgba(34,197,94,0.07)":"rgba(255,77,77,0.06)",border:"1px solid "+(todayRec&&todayRec.status==="done"?"rgba(34,197,94,0.2)":"rgba(255,77,77,0.15)"),borderRadius:"16px",padding:"22px",textAlign:"center",marginBottom:"20px"}}>
                  <div style={{fontSize:"40px",marginBottom:"10px"}}>{todayRec&&todayRec.status==="done"?"✅":"😴"}</div>
                  <div style={{fontWeight:"900",fontSize:"18px",color:C.text}}>{todayRec&&todayRec.status==="done"?"Session logged!":"Rest day logged"}</div>
                  {todayRec&&todayRec.duration && <div style={{fontSize:"13px",color:C.accent,marginTop:"4px",fontWeight:"700"}}>⏱ {todayRec.duration} min</div>}
                  <div style={{fontSize:"13px",color:C.muted,marginTop:"6px"}}>{todayRec&&todayRec.status==="done"?streak+"-day streak 🔥":"Tomorrow is a fresh start."}</div>
                </div>
                <BackBtn onBack={function(){setWorkPhase("workout");}} label="Back to session"/>
                {exercises.filter(function(e){return !e.isFinisher;}).map(function(ex,i){ return <ExCard key={ex.id+i} ex={ex} idx={i} onSwap={swapEx} plateaued={false}/>; })}
                {todayRec&&todayRec.notes && <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:"12px",padding:"14px",marginTop:"16px"}}><div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginBottom:"6px"}}>Notes</div><div style={{fontSize:"13px",color:"#bbb",lineHeight:1.6}}>{todayRec.notes}</div></div>}
                <button onClick={shareSession} style={{width:"100%",marginTop:"16px",padding:"14px",borderRadius:"14px",border:"1px solid "+C.accent+"44",background:C.accent+"10",color:C.accent,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:"8px",fontFamily:"inherit",fontSize:"13px",fontWeight:"700"}}>📤 Share Session</button>
                <button onClick={resetToday} style={{width:"100%",marginTop:"10px",padding:"14px",borderRadius:"14px",border:"1px solid "+C.border,background:"transparent",color:C.muted,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:"8px",fontFamily:"inherit",fontSize:"13px",fontWeight:"600"}}>↺ Change today's session</button>
              </div>
            )}
          </div>
        )}

        {/* ══ VOLUME TAB ══ */}
        {tab==="volume" && <VolumeTab history={history}/>}

        {/* ══ STATS TAB ══ */}
        {tab==="stats" && <StatsTab stats={stats} onSave={saveS} history={history}/>}

      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(App, null), document.getElementById('root'));


</script>
</body>
</html>
