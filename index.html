const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function buildWorkout(groups, totalDone, diffKey, phaseKey, locKey, recentIds=[]) {
  const loc=LOCATIONS[locKey]||LOCATIONS.gym, d=DIFFICULTY[diffKey]||DIFFICULTY.beginner;
  const ph=PHASES[phaseKey]||PHASES.hypertrophy, isDeload=phaseKey==="deload";
  const recentSet=new Set(recentIds), result=[], used=new Set();
  for (const g of groups) {
    const perG=groups.length===1?6:groups.length<=2?3:2;
    const eligible=ALL_EX.filter(ex=>{
      if(ex.g!==g||!loc.equip.has(ex.equip)) return false;
      if(diffKey==="beginner"&&ex.diff!=="beginner") return false;
      if(diffKey==="intermediate"&&ex.diff==="advanced") return false;
      return true;
    });
    const pool=shuffle([...eligible.filter(e=>!recentSet.has(e.id)),...eligible.filter(e=>recentSet.has(e.id))]);
    let count=0;
    for (const ex of pool) {
      if(count>=perG||used.has(ex.id)) continue;
      const sets=isDeload?Math.max(ex.sets-1,2):ex.sets+d.setsBonus;
      const reps=isDeload?"10–12 (light)":ph.reps;
      const rest=`${Math.round(ex.rest*d.restMult)}s`;
      const wlog=getW(); const stored=wlog[ex.id];
      const prog=Math.floor(totalDone/4)*(COMPOUND.has(ex.id)?5:2.5);
      let wt=stored!==undefined?stored:Math.round((ex.w+prog)*d.weightMult/2.5)*2.5;
      if(isDeload) wt=Math.round(wt*0.6/2.5)*2.5;
      const tempo=(diffKey==="advanced"&&!isDeload)?d.tempo:"";
      result.push({...ex,sets,reps,rest,suggestedWeight:wt,tempo});
      used.add(ex.id); count++;
      if(count===1&&ex.pair&&!used.has(ex.pair)&&EX[ex.pair]){
        const pe=EX[ex.pair];
        if(loc.equip.has(pe.equip)){
          const ps=getW()[ex.pair]; const pp=Math.floor(totalDone/4)*(COMPOUND.has(ex.pair)?5:2.5);
          let pw=ps!==undefined?ps:Math.round((pe.w+pp)*d.weightMult/2.5)*2.5;
          if(isDeload) pw=Math.round(pw*0.6/2.5)*2.5;
          result.push({...pe,id:ex.pair,sets,reps,rest,suggestedWeight:pw,tempo,isSupersetPair:true});
          used.add(ex.pair); count++;
        }
      }
    }
  }
  return result.slice(0,7);
}

function buildStreak(h){
  const done=Object.keys(h).filter(d=>h[d]?.status==="done").sort().reverse();
  if(!done.length) return 0;
  let s=0,c=new Date(TODAY);
  for(const d of done){
    const df=Math.round((c-new Date(d))/86400000);
    if(df<=1){s++;c=new Date(d);}
    else if(df===2){
      // Allow 1 rest day gap without breaking streak
      // Only forgive if the skipped day was actually a rest/skip (not just missed)
      const skippedDate=new Date(c); skippedDate.setDate(skippedDate.getDate()-1);
      const skippedStr=skippedDate.toISOString().split("T")[0];
      const skippedEntry=h[skippedStr];
      if(skippedEntry?.isRest||skippedEntry?.status==="skipped"){
        s++;c=new Date(d);
      } else break;
    }
    else break;
  }
  return s;
}
function autoSession(h, excludeKey=null){
  // Core sessions that rotate - PPL is the backbone
  const pool=["push","pull","legs","upper","shoulders","push","pull","legs","arms","push","pull","legs"];
  // Get last completed session to avoid repeating it
  const completedDays=Object.keys(h)
    .filter(d=>d!==TODAY && h[d]?.status==="done")
    .sort().reverse();
  const lastKey=completedDays.length ? h[completedDays[0]]?.sessionKey : null;
  // Exclude both the last completed session AND the one just cancelled today
  const avoid=new Set([lastKey, excludeKey].filter(Boolean));
  const candidates=pool.filter(k=>!avoid.has(k));
  const finalPool=candidates.length ? candidates : pool;
  // Pick randomly from valid candidates
  const pick=finalPool[Math.floor(Math.random()*finalPool.length)];
  return SESSIONS.find(s=>s.key===pick) || SESSIONS[0];
}
function weeklyVol(h){
  const v={}; Object.keys(MUSCLES).forEach(m=>v[m]=0);
  for(const[d,data]of Object.entries(h)){if(d<WEEK_START||data?.status!=="done")continue;for(const ex of(data.exercises||[])){if(v[ex.g]!==undefined)v[ex.g]+=ex.sets||0;}}
  return v;
}
function lastTrained(h){
  const l={};
  for(const d of Object.keys(h).sort().reverse()){if(h[d]?.status!=="done")continue;for(const ex of(h[d]?.exercises||[])){if(!l[ex.g])l[ex.g]=d;}}
  return l;
}
function checkPlateau(h,id){
  const wts=Object.keys(h).sort().reverse().filter(d=>h[d]?.status==="done").slice(0,6).map(d=>(h[d]?.exercises||[]).find(e=>e.id===id)?.suggestedWeight).filter(w=>w!==undefined);
  return wts.length>=3&&wts[0]-wts[wts.length-1]<2.5;
}

function pickFinishers(sessionKey, totalDone) {
  // Rotate through finishers based on session type and total done
  const byType = {
    push:["f1","f5","f6"], pull:["f3","f4","f7"], legs:["f1","f4","f5"],
    upper:["f2","f6","f7"], shoulders:["f1","f5","f8"], arms:["f2","f6","f7"],
    fullbody:["f1","f5","f4"], chest:["f1","f6","f5"], back:["f3","f7","f4"],
  };
  const pool = byType[sessionKey] || ["f1","f5","f6"];
  const pick = pool[totalDone % pool.length];
  const finisher = FINISHERS.find(f=>f.id===pick) || FINISHERS[0];
  return [{...finisher, sets: Math.min(finisher.sets + Math.floor(totalDone/6), 4), isFinisher:true}];
}

const IRefresh=()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" width="14" height="14"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>;

const BackBtn=({onBack,label="Back"})=>(

function SubSheet({ex,onSelect,onClose}){
  const bw=ex.bw&&ex.bw!==ex.id?findEx(ex.bw):null;
  const eq=ex.eq&&ex.eq!==ex.id?findEx(ex.eq):null;
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:300,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#1a1614",borderRadius:"20px 20px 0 0",padding:"24px",width:"100%",maxWidth:"430px",maxHeight:"70vh",overflowY:"auto",paddingBottom:"40px"}}>
        <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginBottom:"6px"}}>Equipment Unavailable?</div>
        <div style={{fontSize:"16px",fontWeight:"800",color:C.text,marginBottom:"20px"}}>Substitutes for {ex.name}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"16px"}}>
          <div>
            <div style={{fontSize:"10px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:"8px",fontFamily:"monospace"}}>🏠 Bodyweight</div>
            {bw?<button onClick={()=>onSelect(bw)} style={{width:"100%",background:"#222",border:`1px solid ${C.border}`,borderRadius:"12px",padding:"14px",textAlign:"left",cursor:"pointer",fontFamily:"inherit"}}><div style={{fontWeight:"700",fontSize:"13px",color:C.text}}>{bw.name}</div><div style={{fontSize:"11px",color:C.muted,marginTop:"3px"}}>{bw.equip}</div><div style={{fontSize:"11px",color:C.green,marginTop:"6px"}}>Same muscle ✓</div></button>:<div style={{fontSize:"12px",color:C.muted,padding:"14px",background:C.card,borderRadius:"12px",border:`1px solid ${C.border}`}}>No direct sub</div>}
          </div>
          <div>
            <div style={{fontSize:"10px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:"8px",fontFamily:"monospace"}}>🏋️ Alt Equipment</div>
            {eq?<button onClick={()=>onSelect(eq)} style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:"12px",padding:"14px",textAlign:"left",cursor:"pointer",fontFamily:"inherit"}}><div style={{fontWeight:"700",fontSize:"13px",color:C.text}}>{eq.name}</div><div style={{fontSize:"11px",color:C.muted,marginTop:"3px"}}>{eq.equip}</div><div style={{fontSize:"11px",color:C.blue,marginTop:"6px"}}>Same result ✓</div></button>:<div style={{fontSize:"12px",color:C.muted,padding:"14px",background:C.card,borderRadius:"12px",border:`1px solid ${C.border}`}}>No direct sub</div>}
          </div>
        </div>
        <button onClick={onClose} style={{width:"100%",padding:"13px",borderRadius:"10px",border:`1px solid ${C.border}`,background:"transparent",color:C.muted,cursor:"pointer",fontFamily:"inherit",fontWeight:"600"}}>Keep Original</button>
      </div>
    </div>
  );
}

function ExCard({ex,idx,onSwap,plateaued,lastWeight=null}){
  const [open,setOpen]=useState(false);
  const [showSub,setShowSub]=useState(false);
  const [wt,setWt]=useState(ex.suggestedWeight??ex.w??0);
  const [editing,setEditing]=useState(false);
  const [inputVal,setInputVal]=useState("");
  const inc=COMPOUND.has(ex.id)?5:2.5;
  useEffect(()=>{setWt(ex.suggestedWeight??ex.w??0);},[ex.id,ex.suggestedWeight]);
  function adj(d){const nw=Math.max(0,Math.round((wt+d)/2.5)*2.5);setWt(nw);const l=getW();l[ex.id]=nw;saveW(l);}
  function startEdit(){setInputVal(String(wt));setEditing(true);}
  function commitEdit(){
    const parsed=parseFloat(inputVal);
    if(!isNaN(parsed)&&parsed>=0){
      const nw=Math.round(parsed/2.5)*2.5;
      setWt(nw);const l=getW();l[ex.id]=nw;saveW(l);
    }
    setEditing(false);
  }
  return(
    <>
      {showSub&&<SubSheet ex={ex} onSelect={alt=>{onSwap(idx,alt);setShowSub(false);setOpen(false);}} onClose={()=>setShowSub(false)}/>}
      {ex.isSupersetPair&&<div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px",paddingLeft:"6px"}}><div style={{width:"2px",height:"14px",background:C.purple,borderRadius:"1px"}}/><span style={{fontSize:"10px",color:C.purple,fontWeight:"700",textTransform:"uppercase",letterSpacing:"0.1em"}}>Superset ↑</span></div>}
      <div style={{background:C.card,border:`1px solid ${plateaued?C.yellow+"55":ex.isSupersetPair?C.purple+"44":C.border}`,borderRadius:"14px",marginBottom:ex.isSupersetPair?"4px":"10px",overflow:"hidden"}}>
        <div style={{padding:"14px 16px"}}>
          <div style={{display:"flex",alignItems:"flex-start",gap:"12px"}}>
            <div style={{minWidth:"30px",height:"30px",borderRadius:"8px",background:ex.isSupersetPair?C.purple:C.accent,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"900",fontSize:"13px",color:"#000"}}>{idx+1}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:"700",fontSize:"15px",color:C.text}}>{ex.name}</div>
              <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{ex.equip}{ex.tempo?` · ${ex.tempo}`:""}</div>
              <div style={{fontSize:"13px",color:"#bbb",marginTop:"5px"}}>
                {ex.sets} sets × {ex.reps}
                {ex.w>0&&<span style={{color:C.accent,fontWeight:"800",marginLeft:"8px"}}>@ {wt} lbs</span>}
                <span style={{color:C.muted,fontSize:"11px",marginLeft:"6px"}}>rest {ex.rest}</span>
              </div>
              {lastWeight&&lastWeight!==wt&&<div style={{fontSize:"11px",color:C.muted,marginTop:"3px"}}>Last time: {lastWeight} lbs</div>}
              {plateaued&&<div style={{fontSize:"11px",color:C.yellow,marginTop:"5px"}}>⚠️ Plateau — try changing rep range or variation</div>}
            </div>
            <button onClick={()=>setOpen(o=>!o)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",padding:"4px"}}><IChev o={open}/></button>
          </div>
          {ex.w>0&&<div style={{display:"flex",alignItems:"center",gap:"8px",marginTop:"12px"}}>
            <span style={{fontSize:"11px",color:C.muted,flex:1}}>Weight</span>
            <button onClick={()=>adj(-inc)} style={{width:"32px",height:"32px",borderRadius:"8px",border:`1px solid ${C.border}`,background:"transparent",color:C.text,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><IMinus/></button>
            {editing?(
              <input type="number" value={inputVal} onChange={e=>setInputVal(e.target.value)} onBlur={commitEdit} onKeyDown={e=>{if(e.key==="Enter")commitEdit();}} autoFocus style={{fontSize:"14px",fontWeight:"800",color:C.accent,width:"80px",textAlign:"center",background:"transparent",border:`1px solid ${C.accent}`,borderRadius:"8px",padding:"4px 6px",outline:"none",fontFamily:"inherit"}}/>
            ):(
              <button onClick={startEdit} title="Tap to type weight" style={{fontSize:"14px",fontWeight:"800",color:C.accent,minWidth:"80px",textAlign:"center",background:"transparent",border:`1px dashed ${C.accent}55`,borderRadius:"8px",padding:"4px 8px",cursor:"pointer",fontFamily:"inherit"}}>{wt} lbs</button>
            )}
            <button onClick={()=>adj(inc)} style={{width:"32px",height:"32px",borderRadius:"8px",border:`1px solid ${C.border}`,background:"transparent",color:C.text,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><IPlus/></button>
          </div>}
        </div>
        {open&&<div style={{borderTop:`1px solid ${C.border}`,padding:"12px 16px",background:"#111"}}>
          <div style={{fontSize:"13px",color:"#bbb",lineHeight:1.6,marginBottom:"12px"}}>💡 {ex.tip}</div>
          <div style={{display:"flex",gap:"8px"}}>
            {ex.video&&<a href={ex.video} target="_blank" rel="noreferrer" style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:"6px",background:"rgba(239,68,68,0.12)",border:"1px solid rgba(239,68,68,0.25)",borderRadius:"8px",padding:"9px",color:"#f87171",fontSize:"12px",fontWeight:"600",textDecoration:"none"}}><IVideo/> Form Video</a>}
            <button onClick={()=>setShowSub(true)} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:"6px",background:"rgba(96,165,250,0.1)",border:"1px solid rgba(96,165,250,0.25)",borderRadius:"8px",padding:"9px",cursor:"pointer",color:C.blue,fontSize:"12px",fontWeight:"600",fontFamily:"inherit"}}><ISwap/> Can't do this?</button>
          </div>
        </div>}
      </div>
    </>
  );
}

function HeatMap({history}){
  const last=lastTrained(history);
  return(
    <div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"16px"}}>
        {Object.entries(MUSCLES).map(([key,m])=>{const days=daysSince(last[key]);const color=heatColor(days);return(
          <div key={key} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"12px",padding:"14px 12px",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:0,left:0,right:0,height:"3px",background:color}}/>

            <div style={{fontSize:"10px",color:C.muted,marginTop:"2px"}}>{days<=1?"Recovering":days>=2?"✓ Ready":""}</div>
          </div>
        );})}
      </div>
      <div style={{display:"flex",gap:"10px",flexWrap:"wrap"}}>
        {[["#ef4444","Today"],[C.orange,"Yesterday"],[C.accent,"Ready"],[C.green,"Fresh"],["#2a2a2a","Not trained"]].map(([col,lbl])=>(
          <div key={lbl} style={{display:"flex",alignItems:"center",gap:"5px"}}><div style={{width:"10px",height:"10px",borderRadius:"2px",background:col}}/><span style={{fontSize:"10px",color:C.muted}}>{lbl}</span></div>
        ))}
      </div>
    </div>
  );
}

function VolTracker({history}){
  const vol=weeklyVol(history);
  const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const today=new Date().getDay();
  const sessDs=Object.keys(history).filter(d=>d>=WEEK_START&&history[d]?.status==="done").map(d=>new Date(d+"T12:00:00").getDay());
  return(
    <div>
      <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.12em",fontFamily:"monospace",marginBottom:"12px"}}>This Week</div>
      <div style={{display:"flex",gap:"6px",marginBottom:"24px"}}>
        {days.map((day,i)=>{const trained=sessDs.includes(i),isToday=i===today;return(
          <div key={day} style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:"9px",color:isToday?C.accent:C.muted,marginBottom:"6px",fontWeight:isToday?"700":"400"}}>{day}</div>
            <div style={{width:"100%",aspectRatio:"1",borderRadius:"8px",background:trained?C.accent:isToday?"#2a2420":"#1a1614",border:isToday&&!trained?`1px solid ${C.accent}44`:"none",display:"flex",alignItems:"center",justifyContent:"center"}}>{trained&&<span style={{fontSize:"11px"}}>✓</span>}</div>
          </div>
        );})}
      </div>
      <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.12em",fontFamily:"monospace",marginBottom:"14px"}}>Sets vs Weekly Target</div>
      {Object.entries(MUSCLES).map(([key,m])=>{const sets=vol[key]||0,pct=Math.min(sets/m.target,1),over=sets>=m.target;return(
        <div key={key} style={{marginBottom:"14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"6px"}}>
            <span style={{fontSize:"13px",fontWeight:"600",color:C.text}}>{m.label}</span>
            <span style={{fontSize:"12px",color:over?C.green:sets===0?C.muted:C.accent,fontWeight:"700"}}>{sets}/{m.target}{over?" ✓":""}</span>
          </div>
          <div style={{height:"6px",background:"#2a2420",borderRadius:"3px",overflow:"hidden"}}><div style={{height:"100%",width:`${pct*100}%`,background:over?C.green:m.color,borderRadius:"3px"}}/></div>
        </div>
      );})}
    </div>
  );
}

  const savePR=()=>{if(!prForm.weight)return;const e={date:prForm.date,exercise:prForm.exercise,weight:parseFloat(prForm.weight)};onSave({...stats,prs:[...(stats.prs||[]),e].sort((a,b)=>b.date.localeCompare(a.date))});setPrForm({...prForm,weight:""});};
  const bl=stats.bodyLog||[],prs=stats.prs||[];

  const best={}; for(const p of prs){if(!best[p.exercise]||p.weight>best[p.exercise].weight)best[p.exercise]=p;}
  return(
    <div>

        {[["body","Body"],["prs","PRs"],["log","Log"]].map(([k,l])=><button key={k} onClick={()=>setSec(k)} style={{flex:1,padding:"9px",borderRadius:"10px",border:"none",cursor:"pointer",fontFamily:"inherit",fontWeight:"700",fontSize:"13px",background:sec===k?C.accent:C.card,color:sec===k?"#000":C.muted}}>{l}</button>)}

      {sec==="body"&&(<>
        {lw&&<div style={{display:"flex",gap:"8px",marginBottom:"20px"}}>
          <div style={{flex:1,background:C.card,borderRadius:"12px",padding:"14px",border:`1px solid ${C.border}`}}><div style={{fontSize:"22px",fontWeight:"900",color:C.accent}}>{lw} lbs</div><div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>Current Weight</div></div>
          {delta&&<div style={{flex:1,background:C.card,borderRadius:"12px",padding:"14px",border:`1px solid ${C.border}`}}><div style={{fontSize:"22px",fontWeight:"900",color:parseFloat(delta)<0?C.green:C.orange}}>{parseFloat(delta)>0?"+":""}{delta} lbs</div><div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>Since start</div></div>}
        </div>}
        {bl.length>1&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px",marginBottom:"20px"}}>
          <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginBottom:"12px"}}>Weight Trend</div>
          <div style={{display:"flex",alignItems:"flex-end",gap:"4px",height:"60px"}}>
            {bl.slice(-10).map((e,i)=>{const min=Math.min(...bl.map(b=>b.weight)),max=Math.max(...bl.map(b=>b.weight)),range=max-min||1,h=Math.max(((e.weight-min)/range)*50+10,10);return(<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}><div style={{fontSize:"8px",color:C.muted}}>{e.weight}</div><div style={{width:"100%",height:`${h}px`,background:C.accent,borderRadius:"3px 3px 0 0",opacity:i===bl.slice(-10).length-1?1:0.4}}/></div>);})}
          </div>
        </div>}
        <div style={{fontSize:"13px",fontWeight:"700",color:C.text,marginBottom:"6px"}}>Log your weight</div>
        <div style={{fontSize:"12px",color:C.muted,marginBottom:"12px"}}>Optional — once a week is enough. Same time of day for consistency.</div>
        <div style={{display:"flex",gap:"8px",marginBottom:"8px"}}>
          <input type="number" placeholder="Your weight (lbs)" value={form.weight} onChange={e=>setForm(f=>({...f,weight:e.target.value}))} style={{...inp,flex:1}}/>
        </div>
        <button onClick={saveBody} style={{width:"100%",padding:"13px",borderRadius:"10px",border:"none",background:C.accent,color:"#fff",fontWeight:"800",fontSize:"14px",cursor:"pointer",fontFamily:"inherit"}}>Save Weight</button>
        {bl.length>0&&<div style={{marginTop:"20px"}}>{[...bl].reverse().slice(0,8).map((e,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}><span style={{fontSize:"13px",color:C.muted}}>{fmt(e.date)}</span><span style={{fontSize:"13px",fontWeight:"700",color:C.text}}>{e.weight} lbs{e.bodyFat?` · ${e.bodyFat}% BF`:""}</span></div>)}</div>}
      </>)}
      {sec==="prs"&&(<>
        {Object.entries(best).length>0&&<div style={{marginBottom:"20px"}}><div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginBottom:"10px"}}>Personal Records 🏆</div>{Object.entries(best).map(([ex,p])=><div key={ex} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:`1px solid ${C.border}`}}><div><div style={{fontSize:"14px",fontWeight:"600",color:C.text}}>{ex}</div><div style={{fontSize:"11px",color:C.muted}}>{fmt(p.date)}</div></div><div style={{fontSize:"18px",fontWeight:"900",color:C.accent}}>{p.weight} lbs</div></div>)}</div>}
        <div style={{fontSize:"13px",fontWeight:"700",color:C.text,marginBottom:"12px"}}>Log a PR manually</div>
        <div style={{fontSize:"12px",color:C.muted,marginBottom:"12px"}}>PRs auto-detect when you beat your best weight in a session.</div>
        <select value={prForm.exercise} onChange={e=>setPrForm(f=>({...f,exercise:e.target.value}))} style={{...inp,marginBottom:"8px",appearance:"none"}}>
          {["Barbell Bench Press","Barbell Deadlift","Barbell Back Squat","Barbell OHP","Barbell Row","Barbell Curl","Pull-Ups"].map(ex=><option key={ex}>{ex}</option>)}
        </select>
        <div style={{display:"flex",gap:"8px",marginBottom:"8px"}}>
          <input type="number" placeholder="Weight (lbs)" value={prForm.weight} onChange={e=>setPrForm(f=>({...f,weight:e.target.value}))} style={{...inp,flex:1}}/>
          <input type="date" value={prForm.date} onChange={e=>setPrForm(f=>({...f,date:e.target.value}))} style={{...inp,flex:1}}/>
        </div>
        <button onClick={savePR} style={{width:"100%",padding:"13px",borderRadius:"10px",border:"none",background:C.accent,color:"#000",fontWeight:"800",fontSize:"14px",cursor:"pointer",fontFamily:"inherit"}}>Save PR</button>
        {prs.length>0&&<div style={{marginTop:"20px"}}>{prs.slice(0,8).map((p,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}><div><div style={{fontSize:"13px",color:C.text}}>{p.exercise}</div><div style={{fontSize:"11px",color:C.muted}}>{fmt(p.date)}</div></div><span style={{fontSize:"14px",fontWeight:"700",color:C.accent}}>{p.weight} lbs</span></div>)}</div>}
      </>)}
      {sec==="log"&&(<>
        <div style={{display:"flex",gap:"8px",marginBottom:"20px"}}>
          {[{l:"Sessions",v:Object.values(history).filter(d=>d?.status==="done").length},{l:"Streak",v:`${buildStreak(history)}d 🔥`}].map(s=><div key={s.l} style={{flex:1,background:C.card,borderRadius:"12px",padding:"14px",border:`1px solid ${C.border}`}}><div style={{fontSize:"20px",fontWeight:"900",color:C.accent}}>{s.v}</div><div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{s.l}</div></div>)}
        </div>
        {sorted2.length===0?<div style={{color:C.muted,textAlign:"center",padding:"40px 0"}}>No sessions yet.</div>:sorted2.map(([d,data])=>{
          const s=SESSIONS.find(s=>s.key===data?.sessionKey);
          const done=data?.status==="done",skip=data?.status==="skipped";
          const df=DIFFICULTY[data?.diffKey],ph=PHASES[data?.phaseKey];
          return(
            <div key={d} style={{padding:"13px 0",borderBottom:`1px solid ${C.border}`}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div>
                  <div style={{fontSize:"14px",fontWeight:"700",color:d===TODAY?C.accent:C.text}}>{d===TODAY?"Today":fmt(d)}</div>
                  <div style={{fontSize:"12px",color:C.muted,marginTop:"2px",display:"flex",gap:"8px",flexWrap:"wrap"}}>
                    {s&&<span>{s.emoji} {s.label}</span>}
                    {df&&<span style={{color:df.color}}>{df.emoji} {df.label}</span>}
                    {ph&&<span style={{color:ph.color}}>{ph.emoji}</span>}
                    {data?.energy&&<span>{"😴🤒😐💪🔥"[data.energy-1]}</span>}
                    {data?.duration&&<span>⏱ {data.duration}min</span>}
                  </div>
                </div>
                <div style={{padding:"5px 12px",borderRadius:"20px",fontSize:"11px",fontWeight:"700",textTransform:"uppercase",background:done?"rgba(34,197,94,0.12)":skip?"rgba(255,77,77,0.1)":"rgba(255,255,255,0.04)",color:done?C.green:skip?C.red:C.muted}}>
                  {done?"✓ Done":skip?"✗ Skip":"—"}
                </div>
              </div>
              {data?.notes&&<div style={{fontSize:"12px",color:"#555",marginTop:"6px",fontStyle:"italic"}}>"{data.notes}"</div>}
            </div>
          );
        })}
      </>)}
    </div>
  );
}

const SESSIONS_LIST = SESSIONS;

function App(){
  const [history,    setHistory]    = useState(()=>gs("ig_h6",{}));
  const [stats,      setStats]      = useState(()=>gs("ig_s6",{}));
  const [exercises,  setExercises]  = useState([]);
  const [sessMeta,   setSessMeta]   = useState(null);
  const [tab,        setTab]        = useState("today");
  const [screen,     setScreen]     = useState("home");
  const [workPhase,  setWorkPhase]  = useState("energy");
  const [energy,     setEnergy]     = useState(null);
  const [diffKey,    setDiffKey]    = useState(()=>gs("ig_d3","beginner"));
  const [manualPhase,setManualPhase]= useState(()=>gs("ig_phase",null)); // null = auto
  const [locKey,     setLocKey]     = useState(()=>gs("ig_l3","gym"));
  const [notes,      setNotes]      = useState("");
  const [celebrating,setCelebrating]= useState(false);
  const [nextWts,    setNextWts]    = useState([]);
  const [rebuilding, setRebuilding] = useState(false);
  const [newPRs, setNewPRs] = useState([]);
  const [elapsed, setElapsed] = useState(0); // seconds
  const [startTime,  setStartTime]  = useState(null);

  const todayRec=history[TODAY];
  const isMonday=new Date().getDay()===1;
  const weightLoggedThisWeek=(stats.bodyLog||[]).some(e=>e.date>=WEEK_START);
  const showWeightReminder=isMonday&&!weightLoggedThisWeek;
  const streak=buildStreak(history);
  const totalDone=Object.values(history).filter(d=>d?.status==="done").length;
  const phaseKey=manualPhase||getPhase(totalDone);
  const phase=PHASES[phaseKey];
  const diff=DIFFICULTY[diffKey];

  useEffect(()=>{
    // Only restore if today has a logged status (done/skipped) or is actively mid-workout
    if(todayRec?.exercises&&todayRec?.sessMeta){
      setExercises(todayRec.exercises);setSessMeta(todayRec.sessMeta);setNotes(todayRec.notes||"");
      setStartTime(todayRec.startTime||null);
      if(todayRec.status==="done"||todayRec.status==="skipped"){
        setWorkPhase(todayRec.isRest?"rest":"done");
      } else if(todayRec.energy){
        // Mid-workout: restore workout phase
        setEnergy(todayRec.energy);
        setWorkPhase("workout");
      } else {
        // No status, no energy logged yet — start fresh
        setWorkPhase("energy");
      }
    } else {
      // No session today at all — always start at energy check-in
      setWorkPhase("energy");
    }
  },[]);

  const saveH=next=>{setHistory(next);ss("ig_h6",next);};
  const saveS=next=>{setStats(next);ss("ig_s6",next);};

  // Live session timer
  useEffect(()=>{
    let interval=null;
    if(workPhase==="workout"&&startTime){
      interval=setInterval(()=>{
        setElapsed(Math.floor((Date.now()-startTime)/1000));
      },1000);
    } else {
      setElapsed(0);
    }
    return ()=>clearInterval(interval);
  },[workPhase,startTime]);
  const savePhase=k=>{
    setManualPhase(k);ss("ig_phase",k);
    const resolvedPhase=k||getPhase(totalDone);
    if(sessMeta&&(workPhase==="workout"||workPhase==="done")){
      setRebuilding(true);
      const recent=Object.keys(history).filter(d=>d!==TODAY).sort().reverse().slice(0,10).flatMap(d=>(history[d]?.exercises||[]).map(e=>e.id));
      const newExs=buildWorkout(sessMeta.groups,totalDone,diffKey,resolvedPhase,locKey,recent);
      setExercises(newExs);saveH({...history,[TODAY]:{...history[TODAY],exercises:newExs,phaseKey:resolvedPhase}});
      setTimeout(()=>setRebuilding(false),600);
    }
    setScreen("home");
  };

  function applyDiff(k){
    setDiffKey(k);ss("ig_d3",k);
    if(sessMeta&&(workPhase==="workout"||workPhase==="done")){
      setRebuilding(true);
      const recent=Object.keys(history).sort().reverse().slice(0,10).flatMap(d=>(history[d]?.exercises||[]).map(e=>e.id));
      const newExs=buildWorkout(sessMeta.groups,totalDone,k,phaseKey,locKey,recent);
      setExercises(newExs);saveH({...history,[TODAY]:{...history[TODAY],exercises:newExs,diffKey:k}});
      setTimeout(()=>setRebuilding(false),600);
    }
    setScreen("home");
  }
  function applyLoc(k){
    setLocKey(k);ss("ig_l3",k);
    if(sessMeta&&(workPhase==="workout"||workPhase==="done")){
      setRebuilding(true);
      const recent=Object.keys(history).sort().reverse().slice(0,10).flatMap(d=>(history[d]?.exercises||[]).map(e=>e.id));
      const newExs=buildWorkout(sessMeta.groups,totalDone,diffKey,phaseKey,k,recent);
      setExercises(newExs);saveH({...history,[TODAY]:{...history[TODAY],exercises:newExs,locKey:k}});
      setTimeout(()=>setRebuilding(false),600);
    }
    setScreen("home");
  }

  function handleEnergy(e){
    setEnergy(e);
    // Just navigate - dont save to history yet so user can go back freely
    if(e<=2){setWorkPhase("rest");}
    else setWorkPhase("pick");
  }

  function startSess(s){
    // Build fresh exercises - exclude recent ones from past sessions only (not today)
    const pastHistory = Object.keys(history).filter(d=>d!==TODAY).sort().reverse().slice(0,10);
    const recent=pastHistory.flatMap(d=>(history[d]?.exercises||[]).map(e=>e.id));
    const exs=buildWorkout(s.groups,totalDone,diffKey,phaseKey,locKey,recent);
    const finishers=pickFinishers(s.key,totalDone);
    const allExs=[...exs,...finishers];
    const t=Date.now();
    // Save completely fresh today record - no spreading old todayRec
    const freshToday={sessionKey:s.key,sessMeta:s,exercises:allExs,energy,diffKey,phaseKey,locKey,startTime:t};
    setExercises(allExs);
    setSessMeta(s);
    setStartTime(t);
    saveH({...history,[TODAY]:freshToday});
    setWorkPhase("workout");
  }

  function swapEx(idx,alt){
    const wlog=getW();const stored=wlog[alt.id];
    const prog=Math.floor(totalDone/4)*(COMPOUND.has(alt.id)?5:2.5);
    const d=DIFFICULTY[diffKey]||DIFFICULTY.beginner;
    const nw=stored!==undefined?stored:Math.round((alt.w+prog)*d.weightMult/2.5)*2.5;
    const upd=exercises.map((e,i)=>i===idx?{...alt,suggestedWeight:nw,sets:e.sets,reps:e.reps,rest:e.rest}:e);
    setExercises(upd);saveH({...history,[TODAY]:{...history[TODAY],exercises:upd}});
  }

  function markDone(){
    const duration=startTime?Math.round((Date.now()-startTime)/60000):null;
    const nw=exercises.filter(e=>e.w>0).map(e=>{
      const cur=getW()[e.id]||e.suggestedWeight||e.w;
      const inc=COMPOUND.has(e.id)?5:2.5;
      const next=Math.round((cur+inc)/2.5)*2.5;
      const l=getW();l[e.id]=next;saveW(l);
      return `${e.name}: ${cur} → ${next} lbs`;
    });
    // Auto-detect PRs — compare current weight to all past logged weights for each exercise
    const autoPRs=[];
    exercises.filter(e=>e.w>0&&e.isPR).forEach(e=>{
      const curW=getW()[e.id]||e.suggestedWeight||e.w;
      const prevPRs=(stats.prs||[]).filter(p=>p.exercise===e.name);
      const prevBest=prevPRs.length?Math.max(...prevPRs.map(p=>p.weight)):0;
      if(curW>prevBest){
        autoPRs.push({date:TODAY,exercise:e.name,weight:curW,auto:true});
      }
    });
    if(autoPRs.length>0){
      const updatedPRs=[...(stats.prs||[]),...autoPRs].sort((a,b)=>b.date.localeCompare(a.date));
      saveS({...stats,prs:updatedPRs});
      setNewPRs(autoPRs);
    }
    setNextWts(nw);setCelebrating(true);setTimeout(()=>setCelebrating(false),10000);
    saveH({...history,[TODAY]:{...history[TODAY],status:"done",notes,duration}});
    setWorkPhase("done");
  }
  function markSkip(){saveH({...history,[TODAY]:{...history[TODAY],status:"skipped",notes}});setWorkPhase("done");}
  function resetToday(){const n={...history};delete n[TODAY];saveH(n);setExercises([]);setSessMeta(null);setNotes("");setStartTime(null);setEnergy(null);setNewPRs([]);setWorkPhase("energy");}

  const sorted=Object.entries(history).sort(([a],[b])=>b.localeCompare(a)).slice(0,30);
  const TABS=[["today","Today"],["volume","Volume"],["stats","Stats"]];

  if(screen==="difficulty") return <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"system-ui,sans-serif"}}><DiffScreen current={diffKey} totalDone={totalDone} onSelect={applyDiff} onBack={()=>setScreen("home")}/></div>;
  if(screen==="location")   return <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"system-ui,sans-serif"}}><LocScreen current={locKey} onSelect={applyLoc} onBack={()=>setScreen("home")}/></div>;
  if(screen==="phase")      return <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"system-ui,sans-serif"}}><PhaseScreen current={manualPhase} autoPhase={getPhase(totalDone)} onSelect={savePhase} onBack={()=>setScreen("home")}/></div>;

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"system-ui,-apple-system,sans-serif",maxWidth:"430px",margin:"0 auto"}}>

      {rebuilding&&<div style={{position:"fixed",top:"60px",left:"50%",transform:"translateX(-50%)",zIndex:500,background:C.accent,color:"#000",padding:"10px 20px",borderRadius:"20px",fontSize:"13px",fontWeight:"800",display:"flex",alignItems:"center",gap:"8px",boxShadow:"0 4px 24px rgba(232,255,71,0.3)"}}><IRefresh/> Rebuilding workout...</div>}

      {celebrating&&<div onClick={()=>setCelebrating(false)} style={{position:"fixed",inset:0,zIndex:999,background:"rgba(0,0,0,0.95)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"28px",gap:"14px"}}>
        <div style={{fontSize:"68px"}}>{newPRs.length>0?"🏅":"🏆"}</div>
        <div style={{fontSize:"22px",fontWeight:"900",color:C.accent}}>{newPRs.length>0?"New PR!":"Session Complete!"}</div>
        <div style={{fontSize:"13px",color:"#888"}}>{streakMsg(streak)}</div>
        {newPRs.length>0&&(
          <div style={{background:`${C.accent}15`,border:`1px solid ${C.accent}44`,borderRadius:"14px",padding:"14px 16px",width:"100%"}}>
            <div style={{fontSize:"11px",color:C.accent,fontWeight:"700",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:"8px",fontFamily:"monospace"}}>🏅 Personal Records Broken</div>
            {newPRs.map((p,i)=>(
              <div key={i} style={{fontSize:"13px",color:C.text,padding:"4px 0",borderBottom:i<newPRs.length-1?`1px solid ${C.border}`:"none"}}>
                {p.exercise} — <span style={{color:C.accent,fontWeight:"800"}}>{p.weight} lbs</span>
              </div>
            ))}
          </div>
        )}
        {history[TODAY]?.duration&&<div style={{fontSize:"13px",color:C.muted}}>⏱ Session time: {history[TODAY].duration} min</div>}
        {nextWts.length>0&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px",width:"100%"}}>
          <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:"10px",fontFamily:"monospace"}}>⚡ Next session targets</div>
          {nextWts.map((m,i)=><div key={i} style={{fontSize:"12px",color:C.text,padding:"4px 0",borderBottom:i<nextWts.length-1?`1px solid ${C.border}`:"none"}}>{m}</div>)}
        </div>}
        <div style={{background:"rgba(34,197,94,0.08)",border:"1px solid rgba(34,197,94,0.2)",borderRadius:"12px",padding:"14px",width:"100%"}}>
          <div style={{fontSize:"11px",color:C.green,marginBottom:"4px",fontWeight:"700"}}>🥗 Post-Workout Nutrition</div>
          <div style={{fontSize:"13px",color:"#bbb",lineHeight:1.6}}>{NUTRITION[totalDone%NUTRITION.length]}</div>
        </div>
      </div>}

      {/* HEADER */}
      <div style={{padding:"52px 24px 14px",paddingTop:"env(safe-area-inset-top, 52px)"}}>
        <div style={{paddingTop:"max(52px, env(safe-area-inset-top))"}}>
          <div style={{fontSize:"10px",letterSpacing:"0.18em",color:C.muted,textTransform:"uppercase",fontFamily:"monospace"}}>{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:"4px"}}>
            <div style={{fontSize:"28px",fontWeight:"900",letterSpacing:"-1px"}}>Iron Log<span style={{color:C.accent}}>.</span></div>
            <div style={{display:"flex",gap:"6px"}}>
              <button onClick={()=>setScreen("location")} style={{display:"flex",alignItems:"center",gap:"4px",background:C.card,border:`1px solid ${C.border}`,borderRadius:"20px",padding:"6px 12px",cursor:"pointer",fontSize:"12px",color:C.muted,fontFamily:"inherit",fontWeight:"600"}}>
                {LOCATIONS[locKey].emoji} {LOCATIONS[locKey].label.split(" ")[0]}
              </button>
              <button onClick={()=>setScreen("phase")} style={{display:"flex",alignItems:"center",gap:"4px",background:C.card,border:`1px solid ${phase.color}55`,borderRadius:"20px",padding:"6px 12px",cursor:"pointer",fontSize:"12px",color:phase.color,fontFamily:"inherit",fontWeight:"700"}}>
                {phase.emoji} {phase.label}
              </button>
              <button onClick={()=>setScreen("difficulty")} style={{display:"flex",alignItems:"center",gap:"4px",background:C.card,border:`1px solid ${diff.color}55`,borderRadius:"20px",padding:"6px 12px",cursor:"pointer",fontSize:"12px",color:diff.color,fontFamily:"inherit",fontWeight:"700"}}>
                {diff.emoji} {diff.label}
              </button>
            </div>
          </div>
        </div>
      </div>

      {/* TABS */}
      <div style={{display:"flex",padding:"0 24px",gap:"6px",marginBottom:"22px",overflowX:"auto"}}>
        {TABS.map(([v,l])=><button key={v} onClick={()=>setTab(v)} style={{padding:"8px 16px",borderRadius:"20px",border:"none",cursor:"pointer",fontFamily:"inherit",fontWeight:"700",fontSize:"13px",whiteSpace:"nowrap",background:tab===v?C.accent:C.card,color:tab===v?"#fff":C.muted,flexShrink:0}}>{l}</button>)}
      </div>

      <div style={{padding:"0 24px",paddingBottom:"calc(100px + env(safe-area-inset-bottom))"}}>

        {tab==="today"&&(<>
          {/* Monday weight reminder */}
          {showWeightReminder&&(
            <div style={{background:"rgba(96,165,250,0.08)",border:"1px solid rgba(96,165,250,0.25)",borderRadius:"14px",padding:"12px 16px",marginBottom:"14px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"12px"}}>
              <div>
                <div style={{fontSize:"13px",fontWeight:"700",color:C.blue,marginBottom:"2px"}}>📊 Monday check-in</div>
                <div style={{fontSize:"12px",color:C.muted}}>Log your weight to track progress over time.</div>
              </div>
              <button onClick={()=>setTab("stats")} style={{flexShrink:0,padding:"8px 14px",borderRadius:"10px",border:"none",background:C.blue,color:"#fff",fontWeight:"800",fontSize:"12px",cursor:"pointer",fontFamily:"inherit"}}>Log it</button>
            </div>
          )}
          <div style={{background:`${phase.color}14`,border:`1px solid ${phase.color}33`,borderRadius:"12px",padding:"10px 14px",marginBottom:"14px",display:"flex",alignItems:"center",gap:"10px"}}>
            <span style={{fontSize:"18px"}}>{phase.emoji}</span>
            <div><div style={{fontSize:"12px",fontWeight:"700",color:phase.color}}>{phase.label} Phase{manualPhase?" (manual)":""}</div><div style={{fontSize:"11px",color:C.muted}}>{phase.note}</div></div>
          </div>

          <div style={{background:streak>0?"linear-gradient(135deg,#1f1108,#2d1a0a)":C.card,border:streak>0?`1px solid ${C.accent}55`:`1px solid ${C.border}`,borderRadius:"18px",padding:"18px 20px",display:"flex",alignItems:"center",gap:"16px",marginBottom:"14px"}}>
            <div style={{fontSize:"40px",lineHeight:1}}>{streak>0?"🔥":"💤"}</div>
            <div>
              <div style={{fontSize:"10px",letterSpacing:"0.14em",textTransform:"uppercase",color:C.muted,fontFamily:"monospace"}}>Streak</div>
              <div style={{fontSize:"32px",fontWeight:"900",lineHeight:1,color:streak>0?C.accent:C.text}}>{streak} {streak===1?"day":"days"}</div>
              <div style={{fontSize:"12px",color:C.muted,marginTop:"3px"}}>{streakMsg(streak)}</div>
            </div>
          </div>

          <div style={{display:"flex",gap:"8px",marginBottom:"22px"}}>
            {[{l:"Sessions",v:totalDone},{l:"Difficulty",v:`${diff.emoji} ${diff.label}`}].map(s=>(
              <div key={s.l} style={{flex:1,background:C.card,borderRadius:"12px",padding:"14px",border:`1px solid ${C.border}`}}>
                <div style={{fontSize:"18px",fontWeight:"900",color:C.accent}}>{s.v}</div>
                <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{s.l}</div>
              </div>
            ))}
          </div>

          {workPhase==="energy"&&(
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"16px",padding:"20px",marginBottom:"20px"}}>
              <div style={{fontSize:"16px",fontWeight:"800",color:C.text,marginBottom:"6px"}}>How are you feeling today?</div>
              <div style={{fontSize:"13px",color:C.muted,marginBottom:"16px"}}>Calibrates your session intensity.</div>
              <div style={{display:"flex",gap:"6px",marginBottom:"12px"}}>
                {[1,2,3,4,5].map(n=>(
                  <button key={n} onClick={()=>setEnergy(n)} style={{flex:1,padding:"12px 4px",borderRadius:"10px",border:`2px solid ${energy===n?eColors[n]:C.border}`,background:energy===n?`${eColors[n]}22`:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:"4px"}}>
                    <span style={{fontSize:"18px"}}>{"😴🤒😐💪🔥"[n-1]}</span>
                    <span style={{fontSize:"9px",color:energy===n?eColors[n]:C.muted,fontWeight:"700"}}>{n}</span>
                  </button>
                ))}
              </div>
              {energy&&(<>
                <div style={{fontSize:"12px",color:energy<=2?C.red:energy===3?C.orange:C.green,marginBottom:"12px"}}>{energy<=2?"😴 Low energy — rest and recover today.":energy===3?"😐 Moderate — solid session, manage intensity.":energy===4?"💪 Strong — push hard today.":"🔥 Beast mode — max effort, chase PRs!"}</div>
                <button onClick={()=>handleEnergy(energy)} style={{width:"100%",padding:"13px",borderRadius:"10px",border:"none",background:C.accent,color:"#000",fontWeight:"800",fontSize:"14px",cursor:"pointer",fontFamily:"inherit"}}>Continue →</button>
              </>)}
            </div>
          )}

          {workPhase==="rest"&&(
            <div>
            <button onClick={()=>{setEnergy(null);setWorkPhase("energy");}} style={{display:"flex",alignItems:"center",gap:"8px",background:"rgba(255,255,255,0.07)",border:`1px solid ${C.border}`,borderRadius:"10px",color:C.text,cursor:"pointer",fontSize:"13px",fontWeight:"700",fontFamily:"inherit",marginBottom:"16px",padding:"9px 16px"}}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg> Change energy rating
            </button>
            <div style={{background:"linear-gradient(135deg,#1a1a2a,#0d0d1a)",border:`1px solid #333`,borderRadius:"16px",padding:"24px",textAlign:"center"}}>
              <div style={{fontSize:"48px",marginBottom:"10px"}}>🌿</div>
              <div style={{fontSize:"18px",fontWeight:"900",color:C.text}}>Rest & Recover</div>
              <div style={{fontSize:"13px",color:C.muted,marginTop:"6px",lineHeight:1.6}}>Low energy today. Recovery is training.</div>
              <div style={{marginTop:"16px",background:"rgba(34,197,94,0.07)",border:"1px solid rgba(34,197,94,0.2)",borderRadius:"12px",padding:"14px",textAlign:"left"}}>
                <div style={{fontSize:"11px",color:C.green,fontWeight:"700",marginBottom:"6px"}}>🥗 Nutrition Focus</div>
                <div style={{fontSize:"13px",color:"#bbb",lineHeight:1.6}}>{NUTRITION[totalDone%NUTRITION.length]}</div>
              </div>
              <button onClick={()=>{saveH({...history,[TODAY]:{status:"skipped",isRest:true,energy}});setWorkPhase("done");setSessMeta({key:"rest",label:"Rest Day",emoji:"🌿",groups:[]});}} style={{width:"100%",marginTop:"16px",padding:"14px",borderRadius:"12px",border:"none",background:"rgba(34,197,94,0.15)",color:C.green,fontWeight:"800",fontSize:"14px",cursor:"pointer",fontFamily:"inherit"}}>
                ✓ Log as Rest Day
              </button>
            </div>
            </div>
          )}

          {workPhase==="pick"&&(<>
            <button onClick={()=>setWorkPhase('energy')} style={{display:'flex',alignItems:'center',gap:'8px',background:'rgba(255,255,255,0.07)',border:`1px solid ${C.border}`,borderRadius:'10px',color:C.text,cursor:'pointer',fontSize:'13px',fontWeight:'700',fontFamily:'inherit',marginBottom:'16px',padding:'9px 16px'}}>
              <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' strokeWidth='2.5' width='16' height='16'><polyline points='15 18 9 12 15 6'/></svg> How are you feeling?
            </button>
            {energy===3&&diffKey!=="beginner"&&(
              <div style={{background:"rgba(234,179,8,0.08)",border:"1px solid rgba(234,179,8,0.25)",borderRadius:"14px",padding:"14px 16px",marginBottom:"16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"12px"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:"13px",fontWeight:"700",color:"#eab308",marginBottom:"3px"}}>😐 Moderate energy today</div>
                  <div style={{fontSize:"12px",color:C.muted,lineHeight:1.5}}>Your trainer suggests dropping to Beginner intensity for this session.</div>
                </div>
                <button onClick={()=>{setDiffKey("beginner");ss("ig_d3","beginner");}} style={{flexShrink:0,padding:"8px 14px",borderRadius:"10px",border:"none",background:"#eab308",color:"#000",fontWeight:"800",fontSize:"12px",cursor:"pointer",fontFamily:"inherit"}}>Drop it</button>
              </div>
            )}
            {energy===4&&(
              <div style={{background:`${C.green}12`,border:`1px solid ${C.green}33`,borderRadius:"14px",padding:"12px 16px",marginBottom:"16px"}}>
                <div style={{fontSize:"12px",color:C.green,fontWeight:"700"}}>💪 Strong today — good day to push heavier than usual.</div>
              </div>
            )}
            {energy===5&&(
              <div style={{background:`${C.accent}12`,border:`1px solid ${C.accent}44`,borderRadius:"14px",padding:"12px 16px",marginBottom:"16px"}}>
                <div style={{fontSize:"12px",color:C.accent,fontWeight:"700"}}>🔥 Beast mode — max effort today. Chase a PR.</div>
              </div>
            )}
            <div style={{fontSize:"17px",fontWeight:"800",marginBottom:"16px"}}>Pick today's session</div>
            <button onClick={()=>{const cancelled=sessMeta?.key||null;startSess(autoSession(history,cancelled));}} style={{width:"100%",padding:"18px",borderRadius:"16px",border:"none",background:C.accent,color:"#fff",fontWeight:"900",fontSize:"15px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:"10px",marginBottom:"16px",fontFamily:"inherit"}}>
              🤖 AI — Optimal Session
              <span style={{fontWeight:"400",fontSize:"12px",opacity:0.65}}>{LOCATIONS[locKey].label} · {diff.label}</span>
            </button>
            <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.12em",fontFamily:"monospace",marginBottom:"12px"}}>Or choose manually</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
              {SESSIONS.map(s=>(
                <button key={s.key} onClick={()=>startSess(s)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"12px",padding:"14px 12px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
                  <div style={{fontSize:"20px",marginBottom:"4px"}}>{s.emoji}</div>
                  <div style={{fontWeight:"700",fontSize:"14px",color:C.text}}>{s.label}</div>
                  <div style={{fontSize:"11px",color:C.muted,marginTop:"2px",lineHeight:1.4}}>{s.desc}</div>
                </button>
              ))}
            </div>
          </>)}

          {workPhase==="workout"&&sessMeta&&(<>
            <div style={{background:"#111",border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px",marginBottom:"20px"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"4px"}}>
                <div style={{fontSize:"10px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace"}}>Today's Session</div>
                <button onClick={resetToday} style={{display:"flex",alignItems:"center",gap:"5px",background:"rgba(255,255,255,0.07)",border:`1px solid ${C.border}`,borderRadius:"20px",padding:"5px 12px",cursor:"pointer",fontSize:"12px",color:C.muted,fontFamily:"inherit",fontWeight:"700"}}>↺ Change</button>
              </div>
              <div style={{fontSize:"20px",fontWeight:"900",color:C.text,marginTop:"4px"}}>{sessMeta.emoji} {sessMeta.label}</div>
              <div style={{display:"flex",gap:"8px",marginTop:"8px",flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontSize:"11px",color:phase.color,fontWeight:"600"}}>{phase.emoji} {phase.label}</span>
                <span style={{fontSize:"11px",color:diff.color,fontWeight:"600"}}>{diff.emoji} {diff.label}</span>
                <span style={{fontSize:"11px",color:C.muted}}>{LOCATIONS[locKey].emoji} {LOCATIONS[locKey].label}</span>
                <span style={{marginLeft:"auto",fontSize:"13px",fontWeight:"800",color:elapsed>3600?C.red:elapsed>2700?C.orange:C.accent,fontFamily:"monospace",letterSpacing:"0.05em"}}>⏱ {fmtTime(elapsed)}</span>
              </div>
            </div>
            <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginBottom:"8px"}}>Warmup</div>
            <div style={{fontSize:"13px",color:"#999",lineHeight:1.7,marginBottom:"20px"}}>{WARMUPS[sessMeta.key]||WARMUPS.fullbody}</div>
            <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginBottom:"12px"}}>Exercises · adjust weight · expand for tips & subs</div>
            {exercises.filter(e=>!e.isFinisher).map((ex,i)=>{
              // Find last used weight for this exercise from history (excluding today)
              const lastEntry=Object.keys(history).filter(d=>d!==TODAY&&history[d]?.status==="done").sort().reverse()
                .map(d=>(history[d]?.exercises||[]).find(e=>e.id===ex.id)).find(e=>e?.suggestedWeight||e?.w);
              const lastWt=lastEntry?(getW()[ex.id]||lastEntry.suggestedWeight||lastEntry.w):null;
              return <ExCard key={ex.id+i} ex={ex} idx={i} onSwap={swapEx} plateaued={checkPlateau(history,ex.id)} lastWeight={lastWt}/>;
            })}
            {exercises.some(e=>e.isFinisher)&&<>
              <div style={{fontSize:"11px",color:C.accent,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginTop:"16px",marginBottom:"10px",display:"flex",alignItems:"center",gap:"6px"}}>
                🔥 Finisher
              </div>
              {exercises.filter(e=>e.isFinisher).map((ex,i)=><ExCard key={ex.id+"f"+i} ex={ex} idx={exercises.filter(e=>!e.isFinisher).length+i} onSwap={()=>{}} plateaued={false}/>)}
            </>}
            <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginTop:"18px",marginBottom:"8px"}}>Cooldown</div>
            <div style={{fontSize:"13px",color:"#999",lineHeight:1.7,marginBottom:"12px"}}>{COOLDOWN}</div>
            <div>
              <div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginBottom:"8px"}}>Session Notes</div>
              <textarea value={notes} onChange={e=>{setNotes(e.target.value);saveH({...history,[TODAY]:{...history[TODAY],notes:e.target.value}});}} placeholder="How did it feel? PRs? Notes for next time..." rows={3} style={{width:"100%",background:"#111",border:`1px solid ${C.border}`,borderRadius:"10px",padding:"12px",color:C.text,fontSize:"13px",fontFamily:"inherit",resize:"none",outline:"none",lineHeight:1.6}}/>
            </div>
            <div style={{display:"flex",gap:"10px",marginTop:"20px"}}>
              <button onClick={markDone} style={{flex:1,padding:"18px",borderRadius:"16px",border:"none",background:C.accent,color:"#fff",fontWeight:"900",fontSize:"16px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:"8px",fontFamily:"inherit"}}><ICheck/> Done!</button>
              <button onClick={markSkip} style={{padding:"18px 20px",borderRadius:"16px",border:`1px solid ${C.border}`,background:"transparent",color:C.muted,fontWeight:"700",fontSize:"14px",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px",fontFamily:"inherit"}}><ISkip/> Skip</button>
            </div>
          </>)}

          {workPhase==="done"&&sessMeta&&(<>
            <div style={{background:todayRec?.status==="done"?"rgba(34,197,94,0.07)":"rgba(255,77,77,0.06)",border:`1px solid ${todayRec?.status==="done"?"rgba(34,197,94,0.2)":"rgba(255,77,77,0.15)"}`,borderRadius:"16px",padding:"22px",textAlign:"center",marginBottom:"20px"}}>
              <div style={{fontSize:"40px",marginBottom:"10px"}}>{todayRec?.status==="done"?"✅":"😴"}</div>
              <div style={{fontWeight:"900",fontSize:"18px",color:C.text}}>{todayRec?.status==="done"?"Session logged!":"Rest day logged"}</div>
              {todayRec?.duration&&<div style={{fontSize:"13px",color:C.accent,marginTop:"4px",fontWeight:"700"}}>⏱ {todayRec.duration} min</div>}
              <div style={{fontSize:"13px",color:C.muted,marginTop:"6px"}}>{todayRec?.status==="done"?`${streak}-day streak 🔥`:"Tomorrow is a fresh start."}</div>
            </div>
            <BackBtn onBack={()=>setWorkPhase("workout")} label="Back to session"/>
            {exercises.map((ex,i)=><ExCard key={ex.id+i} ex={ex} idx={i} onSwap={swapEx}/>)}
            {todayRec?.notes&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"12px",padding:"14px",marginTop:"16px"}}><div style={{fontSize:"11px",color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"monospace",marginBottom:"6px"}}>Notes</div><div style={{fontSize:"13px",color:"#bbb",lineHeight:1.6}}>{todayRec.notes}</div></div>}
            <button onClick={resetToday} style={{width:"100%",marginTop:"20px",padding:"14px",borderRadius:"14px",border:`1px solid ${C.border}`,background:"transparent",color:C.muted,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:"8px",fontFamily:"inherit",fontSize:"13px",fontWeight:"600"}}>↺ Change today's session</button>
          </>)}
        </>)}

        {tab==="volume"&&(<><HeatMap history={history}/><div style={{height:"1px",background:C.border,margin:"24px 0"}}/><VolTracker history={history}/></>)}
        {tab==="stats"&&<StatsTab stats={stats} onSave={saveS} history={history}/>}
 
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
  </script>
</body>
</html>
